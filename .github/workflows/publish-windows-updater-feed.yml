name: Publish RDT Connect updater feed

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform and architecture to publish
        required: true
        type: choice
        options:
          - darwin-aarch64
          - windows-aarch64
          - windows-x86_64
          - linux-aarch64
          - linux-x86_64
      version:
        description: Exact version including platform build marker
        required: true
        type: string
      release_tag:
        description: Exact existing RDT Connect release tag
        required: true
        type: string
      asset_name:
        description: Exact updater-compatible release artifact filename
        required: true
        type: string
      notes:
        description: Updater release notes
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rdt-connect-updater-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate requested release
        id: release
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, os
          target, version, tag = (
              os.environ["TARGET"], os.environ["VERSION"], os.environ["RELEASE_TAG"]
          )
          spec = importlib.util.spec_from_file_location(
              "feed_generator", "rdt_connect/scripts/generate-updater-feed.py"
          )
          gen = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gen)
          feeds = {
              "darwin-aarch64": "rdt_connect/updates/dev/darwin/aarch64/latest.json",
              "windows-aarch64": "rdt_connect/updates/dev/windows/aarch64/latest.json",
              "windows-x86_64": "rdt_connect/updates/dev/windows/x86_64/latest.json",
              "linux-aarch64": "rdt_connect/updates/dev/linux/aarch64/latest.json",
              "linux-x86_64": "rdt_connect/updates/dev/linux/x86_64/latest.json",
          }
          if target not in feeds:
              raise SystemExit("FAIL: unsupported target")
          asset = os.environ.get("ASSET_NAME", "")
          if not asset or asset in {".", ".."} or "/" in asset or "\\" in asset:
              raise SystemExit("FAIL: asset_name must be a filename, not a path")
          if target.startswith("linux-"):
              raise SystemExit("FAIL: Linux updater publication is blocked until signed Tauri updater artifacts and verification sidecars are published.")
          try:
              gen.parse_version(version, target)
          except (ValueError, TypeError) as exc:
              raise SystemExit(f"FAIL: invalid version/build marker: {exc}")
          marker = version.rsplit(".", 1)[1]
          expected = "connect-v" + version.rsplit(".", 1)[0] + "-" + marker.lower()
          if tag != expected:
              raise SystemExit(f"FAIL: expected release tag {expected}")
          feed = feeds[target]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"asset={asset}\nfeed={feed}\n")
          print(f"PASS: {target} {version} {tag} asset={asset}")
          PY

      - name: Download and validate exact updater artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            darwin-aarch64)
              [[ "$ASSET" == *.app.tar.gz ]] || { echo "FAIL: macOS updater asset must be a signed .app.tar.gz"; exit 1; }
              ;;
            windows-aarch64|windows-x86_64)
              [[ "$ASSET" == *.exe ]] || { echo "FAIL: Windows updater asset must be an .exe"; exit 1; }
              ;;
            linux-aarch64|linux-x86_64)
              echo "FAIL: Linux updater publication is blocked until signed Tauri updater artifacts and verification sidecars are published."
              exit 1
              ;;
            *)
              echo "FAIL: unsupported target"; exit 1
              ;;
          esac

          mkdir -p "$RUNNER_TEMP/release"
          patterns=(--pattern "$ASSET" --pattern "$ASSET.sig")
          if [[ "$TARGET" == windows-* ]]; then
            patterns+=(--pattern "$ASSET.sha256" --pattern "$ASSET.sig.sha256")
          fi
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release" \
            "${patterns[@]}"

          python3 - "$RUNNER_TEMP/release" "$ASSET" "$TARGET" <<'PYVERIFY'
          import base64, hashlib, re, sys
          from pathlib import Path

          directory, name, target = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          artifact = directory / name
          signature_file = directory / (name + ".sig")
          for f in (artifact, signature_file):
              if not f.is_file() or not f.stat().st_size:
                  raise SystemExit(f"FAIL: missing or empty required asset: {f.name}")

          encoded = signature_file.read_text().strip()
          if not encoded or "\n" in encoded or "\r" in encoded:
              raise SystemExit("FAIL: signature payload must be one nonempty line")
          try:
              base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f"FAIL: signature is not valid base64: {exc}")

          if target.startswith("windows-"):
              for sidecar_name, checked in (
                  (name + ".sha256", artifact),
                  (name + ".sig.sha256", signature_file),
              ):
                  sidecar = directory / sidecar_name
                  if not sidecar.is_file() or not sidecar.stat().st_size:
                      raise SystemExit(f"FAIL: missing checksum sidecar: {sidecar_name}")
                  fields = sidecar.read_text().split()
                  if not fields or not re.fullmatch(r"[0-9a-fA-F]{64}", fields[0]):
                      raise SystemExit(f"FAIL: malformed checksum: {sidecar_name}")
                  actual = hashlib.sha256(checked.read_bytes()).hexdigest()
                  if actual.lower() != fields[0].lower():
                      raise SystemExit(f"FAIL: SHA-256 mismatch for {checked.name}")
                  print(f"PASS: checksum {checked.name}")

          print(f"PASS: required updater artifact and signature downloaded for {target}")
          PYVERIFY

      - name: Verify signed updater artifact with configured updater key
        shell: bash
        env:
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          python3 - <<'PYKEY'
          import base64, json, os
          from pathlib import Path

          config = json.loads(
              Path("rdt_connect/src-tauri/tauri.conf.json").read_text()
          )
          encoded_key = config["plugins"]["updater"]["pubkey"]
          key_bytes = base64.b64decode(encoded_key, validate=True)
          key_path = Path(os.environ["RUNNER_TEMP"]) / "rdt-connect-updater.pub"
          key_path.write_bytes(key_bytes)

          release_dir = Path(os.environ["RUNNER_TEMP"]) / "release"
          asset = os.environ["ASSET"]
          encoded_signature = (release_dir / (asset + ".sig")).read_text().strip()
          signature_bytes = base64.b64decode(encoded_signature, validate=True)
          signature_path = release_dir / (asset + ".minisig")
          signature_path.write_bytes(signature_bytes)
          print("PASS: decoded configured public key and installer signature")
          PYKEY
          minisign -Vm "$RUNNER_TEMP/release/$ASSET" \
            -x "$RUNNER_TEMP/release/$ASSET.minisig" \
            -p "$RUNNER_TEMP/rdt-connect-updater.pub"
      - name: Run generator tests
        shell: bash
        run: |
          set -euo pipefail
          cd rdt_connect
          python3 -m py_compile scripts/generate-updater-feed.py
          python3 scripts/test-generate-updater-feed.py -v

      - name: Generate and validate feed
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          FEED_PATH: ${{ steps.release.outputs.feed }}
          RELEASE_DIR: ${{ runner.temp }}/release
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET}"
          SIGNATURE="$(cat "$RELEASE_DIR/$ASSET.sig")"
          args=(
            --version "$VERSION" --target "$TARGET" --url "$URL"
            --signature "$SIGNATURE" --notes "$NOTES" --output "$FEED_PATH"
          )
          if [[ -e "$FEED_PATH" ]]; then args+=(--update); fi
          python3 rdt_connect/scripts/generate-updater-feed.py "${args[@]}"
          python3 - "$FEED_PATH" "$TARGET" "$VERSION" "$URL" "$SIGNATURE" <<'PY'
          import importlib.util, json, sys
          from pathlib import Path
          path, target, version, url, expected_signature = sys.argv[1:]
          spec = importlib.util.spec_from_file_location(
              "feed_generator", "rdt_connect/scripts/generate-updater-feed.py"
          )
          gen = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gen)
          try:
              data = json.loads(Path(path).read_text(encoding="utf-8"))
              gen.validate_manifest(data, target)
              if data["version"] != version:
                  raise ValueError("manifest version mismatch")
              if data["platforms"][target]["url"] != url:
                  raise ValueError("manifest URL mismatch")
              if data["platforms"][target]["signature"] != expected_signature:
                  raise ValueError("manifest signature does not match verified release asset")
              from urllib.parse import urlparse
              parsed = urlparse(url)
              if parsed.netloc != "github.com" or not parsed.path.startswith(
                  f"/{__import__('os').environ['GITHUB_REPOSITORY']}/releases/download/"
              ):
                  raise ValueError("release URL is outside the expected repository")
          except (ValueError, KeyError, TypeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"FAIL: feed manifest validation: {exc}")
          print(f"PASS: feed manifest {target} {version}")
          PY

      - name: Open pull request for selected feed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: ${{ steps.release.outputs.feed }}
          branch: automation/updater-feed-${{ inputs.target }}
          base: main
          delete-branch: true
          commit-message: "Publish RDT Connect updater feed ${{ inputs.target }} ${{ inputs.version }}"
          title: "Publish RDT Connect updater feed: ${{ inputs.target }}"
          body: |
            Publishes the validated updater feed for `${{ inputs.target }}`.
            The workflow validates the selected release assets and signature before opening this PR.
