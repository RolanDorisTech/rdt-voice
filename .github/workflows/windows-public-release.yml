name: Promote RDT Connect Windows and Linux qualification artifacts

run-name: Promote qualification run ${{ inputs.qualification_run_id }}

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful four-target qualification workflow run ID
        required: true
        type: string
      qualification_run_attempt:
        description: Exact successful run attempt
        required: true
        default: "1"
        type: string
      expected_base_version:
        description: Base version without platform marker
        required: true
        type: string
      publish_release:
        description: Publish all four releases after every draft is verified
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: rdt-connect-release-promotion-${{ inputs.expected_base_version }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and promote exact qualified artifacts (no rebuild)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
      QUALIFICATION_RUN_ATTEMPT: ${{ inputs.qualification_run_attempt }}
      EXPECTED_BASE_VERSION: ${{ inputs.expected_base_version }}
      QUALIFICATION_WORKFLOW_NAME: Windows and Linux four-target native qualification
      QUALIFICATION_WORKFLOW_PATH: .github/workflows/windows-linux-native-qualification.yml

    steps:
      - name: Preflight release mutation credential
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RDT_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_TOKEN" ]] || {
            echo "STOP: configure repository secret RDT_RELEASE_TOKEN before promotion." >&2
            exit 1
          }
          echo "PASS: release mutation credential is configured."
      - name: Validate exact successful qualification run and all 12 artifacts
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$QUALIFICATION_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]

          mkdir -p "$RUNNER_TEMP/rdt-promotion"
          run_json="$RUNNER_TEMP/rdt-promotion/run.json"
          artifacts_json="$RUNNER_TEMP/rdt-promotion/artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" > "$run_json"

          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg name "$QUALIFICATION_WORKFLOW_NAME" \
            --arg path "$QUALIFICATION_WORKFLOW_PATH" \
            --argjson attempt "$QUALIFICATION_RUN_ATTEMPT" '
              .repository.full_name == $repo and
              .head_repository.full_name == $repo and
              .name == $name and
              .path == $path and
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "success" and
              .run_attempt == $attempt and
              (.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
            ' "$run_json" >/dev/null || {
              echo "STOP: run is not the exact successful four-target qualification workflow." >&2
              exit 1
            }

          source_sha="$(jq -r '.head_sha' "$run_json")"
          source_branch="$(jq -r '.head_branch' "$run_json")"
          source_ref="refs/heads/$source_branch"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID/artifacts?per_page=100" > "$artifacts_json"

          require_artifact() {
            local name="$1"
            local rows
            rows="$(jq --arg name "$name" '[.artifacts[] | select(.name == $name)]' "$artifacts_json")"
            [[ "$(jq 'length' <<<"$rows")" == "1" ]] || {
              echo "STOP: expected exactly one artifact: $name" >&2
              exit 1
            }
            jq -e --argjson run_id "$QUALIFICATION_RUN_ID" --arg sha "$source_sha" '
              .[0].expired == false and
              .[0].size_in_bytes > 0 and
              .[0].workflow_run.id == $run_id and
              .[0].workflow_run.head_sha == $sha
            ' <<<"$rows" >/dev/null || {
              echo "STOP: artifact is expired, empty, or from another run/commit: $name" >&2
              exit 1
            }
            echo "PASS: $name"
          }

          names=(
            "RDT-Connect-Windows-x64-DISTRIBUTION-$QUALIFICATION_RUN_ATTEMPT"
            "RDT-Connect-Windows-x64-INSTALLATION-GUIDE-$QUALIFICATION_RUN_ATTEMPT"
            "RDT-Connect-Windows-x64-TEST-INSTALLER-$QUALIFICATION_RUN_ATTEMPT"
            "rdt-windows-x64-installed-qualification-$QUALIFICATION_RUN_ATTEMPT"
            "rdt-connect-windows-x64-release-manifest-$QUALIFICATION_RUN_ID-$QUALIFICATION_RUN_ATTEMPT"
            "RDT-Connect-Windows-ARM64-DISTRIBUTION-$QUALIFICATION_RUN_ATTEMPT"
            "RDT-Connect-Windows-ARM64-INSTALLATION-GUIDE-$QUALIFICATION_RUN_ATTEMPT"
            "RDT-Connect-Windows-ARM64-TEST-INSTALLER-$QUALIFICATION_RUN_ATTEMPT"
            "rdt-windows-arm64-installed-qualification-$QUALIFICATION_RUN_ATTEMPT"
            "rdt-connect-windows-arm64-release-manifest-$QUALIFICATION_RUN_ID-$QUALIFICATION_RUN_ATTEMPT"
            "rdt-connect-linux-x64-qualification-$QUALIFICATION_RUN_ID-$QUALIFICATION_RUN_ATTEMPT"
            "rdt-connect-linux-ARM64-qualification-$QUALIFICATION_RUN_ID-$QUALIFICATION_RUN_ATTEMPT"
          )
          for name in "${names[@]}"; do require_artifact "$name"; done

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "PASS: exact run, attempt, source commit and 12 artifacts validated."

      - name: Check out exact qualified source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Install Minisign verifier
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          minisign -v

      - name: Download exact artifacts from the qualification run
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rdt-promotion"
          attempt="$QUALIFICATION_RUN_ATTEMPT"
          run="$QUALIFICATION_RUN_ID"

          download_one() {
            local name="$1"
            local destination="$2"
            mkdir -p "$destination"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" \
              --name "$name" --dir "$destination"
          }

          download_one "RDT-Connect-Windows-x64-DISTRIBUTION-$attempt" "$root/windows-x64/assets"
          download_one "RDT-Connect-Windows-x64-INSTALLATION-GUIDE-$attempt" "$root/windows-x64/assets"
          download_one "RDT-Connect-Windows-x64-TEST-INSTALLER-$attempt" "$root/windows-x64/assets"
          download_one "rdt-windows-x64-installed-qualification-$attempt" "$root/windows-x64/evidence"
          download_one "rdt-connect-windows-x64-release-manifest-$run-$attempt" "$root/windows-x64/manifest"

          download_one "RDT-Connect-Windows-ARM64-DISTRIBUTION-$attempt" "$root/windows-arm64/assets"
          download_one "RDT-Connect-Windows-ARM64-INSTALLATION-GUIDE-$attempt" "$root/windows-arm64/assets"
          download_one "RDT-Connect-Windows-ARM64-TEST-INSTALLER-$attempt" "$root/windows-arm64/assets"
          download_one "rdt-windows-arm64-installed-qualification-$attempt" "$root/windows-arm64/evidence"
          download_one "rdt-connect-windows-arm64-release-manifest-$run-$attempt" "$root/windows-arm64/manifest"

          download_one "rdt-connect-linux-x64-qualification-$run-$attempt" "$root/linux-x64"
          download_one "rdt-connect-linux-ARM64-qualification-$run-$attempt" "$root/linux-ARM64"
          normalize_linux_artifact() {
            local base="$1" found
            local -a packages=() manifests=()

            while IFS= read -r -d '' found; do
              packages+=("$found")
            done < <(find "$base" -type d -name package -print0)

            [[ "${#packages[@]}" -eq 1 ]] || {
              echo "STOP: expected exactly one Linux package directory under $base." >&2
              return 1
            }

            if [[ "${packages[0]}" != "$base/package" ]]; then
              [[ ! -e "$base/package" ]] || {
                echo "STOP: Linux package destination already exists: $base/package" >&2
                return 1
              }
              mv "${packages[0]}" "$base/package"
            fi

            while IFS= read -r -d '' found; do
              manifests+=("$found")
            done < <(find "$base" -type f -name release-manifest.json -print0)

            [[ "${#manifests[@]}" -eq 1 ]] || {
              echo "STOP: expected exactly one Linux release manifest under $base." >&2
              return 1
            }

            if [[ "${manifests[0]}" != "$base/release-manifest.json" ]]; then
              [[ ! -e "$base/release-manifest.json" ]] || {
                echo "STOP: Linux manifest destination already exists: $base/release-manifest.json" >&2
                return 1
              }
              mv "${manifests[0]}" "$base/release-manifest.json"
            fi

            echo "PASS: normalized Linux package and manifest under $base."
          }

          normalize_linux_artifact "$root/linux-x64"
          normalize_linux_artifact "$root/linux-ARM64"

          echo "PASS: downloaded all 12 exact-run artifacts."

      - name: Verify all manifests, hashes, evidence and Tauri signatures
        id: verify
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rdt-promotion"
          tags="$root/tags.txt"
          : > "$tags"

          manifest_in() {
            local dir="$1"
            local -a found=()
            mapfile -t found < <(find "$dir" -type f -name release-manifest.json -print)
            [[ "${#found[@]}" -eq 1 ]] || {
              echo "STOP: expected one manifest under $dir" >&2
              exit 1
            }
            printf '%s\n' "${found[0]}"
          }

          verify_one() {
            local platform="$1" arch="$2" marker="$3" manifest="$4"
            shift 4
            jq -e --arg base "$EXPECTED_BASE_VERSION" \
              '.target.base_version == $base' "$manifest" >/dev/null || {
              echo "STOP: unexpected base version in $manifest" >&2
              exit 1
            }
            local result tag
            result="$(python3 rdt_connect/scripts/verify_release_artifact_manifest.py \
              --manifest "$manifest" "$@" \
              --platform "$platform" --architecture "$arch" --marker "$marker" \
              --repository "$GITHUB_REPOSITORY" \
              --source-sha "$SOURCE_SHA" --source-ref "$SOURCE_REF" \
              --run-id "$QUALIFICATION_RUN_ID" \
              --run-attempt "$QUALIFICATION_RUN_ATTEMPT" \
              --workflow-name "Windows and Linux four-target native qualification" \
              --tauri-config rdt_connect/src-tauri/tauri.conf.json)"
            printf '%s\n' "$result"
            tag="$(awk -F= '$1 == "RELEASE_TAG" {print $2}' <<<"$result")"
            [[ -n "$tag" ]] || { echo "STOP: verifier supplied no release tag." >&2; exit 1; }
            echo "$tag" >> "$tags"
          }

          verify_one windows x64 3A01 \
            "$(manifest_in "$root/windows-x64/manifest")" \
            --asset-root "$root/windows-x64/assets" \
            --evidence-root "$root/windows-x64/evidence"

          verify_one windows ARM64 2A05 \
            "$(manifest_in "$root/windows-arm64/manifest")" \
            --asset-root "$root/windows-arm64/assets" \
            --evidence-root "$root/windows-arm64/evidence"

          x64_package="$(find "$root/linux-x64" -type d -name package -print -quit)"
          arm_package="$(find "$root/linux-ARM64" -type d -name package -print -quit)"
          [[ -n "$x64_package" && -n "$arm_package" ]] || {
            echo "STOP: Linux package directory missing." >&2
            exit 1
          }

          verify_one linux x64 5L001 \
            "$(manifest_in "$root/linux-x64")" \
            --asset-root "$x64_package" --evidence-root "$root/linux-x64"

          verify_one linux ARM64 4L001 \
            "$(manifest_in "$root/linux-ARM64")" \
            --asset-root "$arm_package" --evidence-root "$root/linux-ARM64"

          [[ "$(wc -l < "$tags" | tr -d ' ')" == "4" ]] || {
            echo "STOP: four distinct platform tags are required." >&2
            exit 1
          }
          [[ "$(sort -u "$tags" | wc -l | tr -d ' ')" == "4" ]] || {
            echo "STOP: platform release tags are not unique." >&2
            exit 1
          }

          {
            echo "windows_x64_tag=$(sed -n '1p' "$tags")"
            echo "windows_arm64_tag=$(sed -n '2p' "$tags")"
            echo "linux_x64_tag=$(sed -n '3p' "$tags")"
            echo "linux_arm64_tag=$(sed -n '4p' "$tags")"
          } >> "$GITHUB_OUTPUT"
          echo "PASS: all four manifests, exact-run evidence, checksums and signatures verified."

      - name: Create four complete draft releases without rebuilding
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_TOKEN: ${{ secrets.RDT_RELEASE_TOKEN }}
          X64_TAG: ${{ steps.verify.outputs.windows_x64_tag }}
          ARM64_TAG: ${{ steps.verify.outputs.windows_arm64_tag }}
          LINUX_X64_TAG: ${{ steps.verify.outputs.linux_x64_tag }}
          LINUX_ARM64_TAG: ${{ steps.verify.outputs.linux_arm64_tag }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rdt-promotion"
          shopt -s nullglob
          created_tags=()
          [[ -n "$RELEASE_TOKEN" ]] || {
            echo "STOP: repository secret RDT_RELEASE_TOKEN is required for this workflow-changing source commit." >&2
            exit 1
          }
          promotion_marker="RDT-PROMOTION:${QUALIFICATION_RUN_ID}:${QUALIFICATION_RUN_ATTEMPT}:${SOURCE_SHA}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          tag_commit_sha() {
            local tag="$1" ref_json object_type object_sha tag_json
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")" || return 1
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            if [[ "$object_type" == "tag" ]]; then
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")" || return 1
              jq -e '.object.type == "commit"' <<<"$tag_json" >/dev/null || return 1
              object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
              object_type="commit"
            fi
            [[ "$object_type" == "commit" && "$object_sha" == "$SOURCE_SHA" ]]
          }

          cleanup_created_drafts() {
            local status=$?
            trap - ERR
            echo "WARNING: draft creation incomplete; deleting drafts created by this promotion attempt." >&2
            for created_tag in "${created_tags[@]}"; do
              cleanup_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$created_tag" 2>/dev/null)" || {
                echo "WARNING: could not inspect $created_tag; leaving it untouched." >&2
                continue
              }
              jq -e --arg tag "$created_tag" --arg marker "$promotion_marker" '
                .tag_name == $tag and
                .draft == true and
                .prerelease == true and
                ((.body // "") | type == "string" and contains($marker))
              ' <<<"$cleanup_release" >/dev/null || {
                echo "WARNING: $created_tag does not match this promotion's draft identity; refusing deletion." >&2
                continue
              }
              if ! tag_commit_sha "$created_tag"; then
                echo "WARNING: $created_tag does not resolve to the qualified source commit; refusing deletion." >&2
                continue
              fi
              GH_TOKEN="$RELEASE_TOKEN" gh release delete "$created_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag ||
                echo "WARNING: failed to clean up draft $created_tag; manual owner review required." >&2
            done
            exit "$status"
          }
          trap cleanup_created_drafts ERR

          check_tag() {
            local tag="$1"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "STOP: release already exists: $tag" >&2
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "STOP: Git tag already exists without a release: $tag" >&2
              exit 1
            fi
          }
          for tag in "$X64_TAG" "$ARM64_TAG" "$LINUX_X64_TAG" "$LINUX_ARM64_TAG"; do
            check_tag "$tag"
          done

          x64_manifest="$(find "$root/windows-x64/manifest" -name release-manifest.json -print -quit)"
          x64_assets=("$root/windows-x64/assets/"*)
          [[ "${#x64_assets[@]}" -eq 8 && -n "$x64_manifest" ]]
          created_tags+=("$X64_TAG")
          GH_TOKEN="$RELEASE_TOKEN" gh release create "$X64_TAG" "${x64_assets[@]}" "$x64_manifest" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "RDT Connect $EXPECTED_BASE_VERSION — Windows x64 Build 3A01" \
            --notes "Promotion marker: $promotion_marker. No-rebuild promotion from qualification run $QUALIFICATION_RUN_ID attempt $QUALIFICATION_RUN_ATTEMPT, source $SOURCE_SHA. Signed installer, checksums, distribution, guide and manifest included." \
            --prerelease --draft

          arm_manifest="$(find "$root/windows-arm64/manifest" -name release-manifest.json -print -quit)"
          arm_assets=("$root/windows-arm64/assets/"*)
          [[ "${#arm_assets[@]}" -eq 8 && -n "$arm_manifest" ]]
          created_tags+=("$ARM64_TAG")
          GH_TOKEN="$RELEASE_TOKEN" gh release create "$ARM64_TAG" "${arm_assets[@]}" "$arm_manifest" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "RDT Connect $EXPECTED_BASE_VERSION — Windows ARM64 Build 2A05" \
            --notes "Promotion marker: $promotion_marker. No-rebuild promotion from qualification run $QUALIFICATION_RUN_ID attempt $QUALIFICATION_RUN_ATTEMPT, source $SOURCE_SHA. Signed installer, checksums, distribution, guide and manifest included." \
            --prerelease --draft

          x64_manifest="$(find "$root/linux-x64" -maxdepth 1 -name release-manifest.json -print -quit)"
          x64_assets=("$root/linux-x64/package/"*)
          [[ "${#x64_assets[@]}" -eq 5 && -n "$x64_manifest" ]]
          created_tags+=("$LINUX_X64_TAG")
          GH_TOKEN="$RELEASE_TOKEN" gh release create "$LINUX_X64_TAG" "${x64_assets[@]}" "$x64_manifest" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "RDT Connect $EXPECTED_BASE_VERSION — Linux x64 Build 5L001" \
            --notes "Promotion marker: $promotion_marker. No-rebuild promotion from qualification run $QUALIFICATION_RUN_ID attempt $QUALIFICATION_RUN_ATTEMPT. Includes the real .deb and signed AppImage updater payload with checksums." \
            --prerelease --draft

          arm_manifest="$(find "$root/linux-ARM64" -maxdepth 1 -name release-manifest.json -print -quit)"
          arm_assets=("$root/linux-ARM64/package/"*)
          [[ "${#arm_assets[@]}" -eq 5 && -n "$arm_manifest" ]]
          created_tags+=("$LINUX_ARM64_TAG")
          GH_TOKEN="$RELEASE_TOKEN" gh release create "$LINUX_ARM64_TAG" "${arm_assets[@]}" "$arm_manifest" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "RDT Connect $EXPECTED_BASE_VERSION — Linux ARM64 Build 4L001" \
            --notes "Promotion marker: $promotion_marker. No-rebuild promotion from qualification run $QUALIFICATION_RUN_ID attempt $QUALIFICATION_RUN_ATTEMPT. Includes the real .deb and signed AppImage updater payload with checksums." \
            --prerelease --draft
          trap - ERR

          echo "PASS: four draft releases created from exact qualified artifacts."

      - name: Verify all four drafts before publishing any
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          X64_TAG: ${{ steps.verify.outputs.windows_x64_tag }}
          ARM64_TAG: ${{ steps.verify.outputs.windows_arm64_tag }}
          LINUX_X64_TAG: ${{ steps.verify.outputs.linux_x64_tag }}
          LINUX_ARM64_TAG: ${{ steps.verify.outputs.linux_arm64_tag }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rdt-promotion"

          promotion_marker="RDT-PROMOTION:${QUALIFICATION_RUN_ID}:${QUALIFICATION_RUN_ATTEMPT}:${SOURCE_SHA}"

          tag_commit_sha() {
            local tag="$1" ref_json object_type object_sha tag_json
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            if [[ "$object_type" == "tag" ]]; then
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<<"$tag_json")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
            fi
            [[ "$object_type" == "commit" && "$object_sha" == "$SOURCE_SHA" ]] || {
              echo "STOP: release tag does not resolve to qualified source SHA: $tag" >&2
              return 1
            }
          }

          verify_release_identity() {
            local tag="$1" release_json
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            jq -e --arg tag "$tag" --arg marker "$promotion_marker" '
              .tag_name == $tag and
              .prerelease == true and
              ((.body // "") | type == "string" and contains($marker))
            ' <<<"$release_json" >/dev/null || {
              echo "STOP: release marker or prerelease identity mismatch: $tag" >&2
              return 1
            }
            tag_commit_sha "$tag"
          }

          verify_draft() {
            local tag="$1" directory="$2" expected_count="$3"
            local expected="$root/expected-assets.txt"
            local actual="$root/actual-assets.txt"
            verify_release_identity "$tag"
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            jq -e '.draft == true and .prerelease == true and (.assets | length > 0)' <<<"$release_json" >/dev/null || {
              echo "STOP: release is not an unpublished draft: $tag" >&2
              return 1
            }
            find "$directory" -maxdepth 1 -type f -printf '%f\n' | sort > "$expected"
            printf '%s\n' release-manifest.json >> "$expected"
            sort -o "$expected" "$expected"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | sort > "$actual"
            [[ "$(wc -l < "$actual" | tr -d ' ')" == "$expected_count" ]] || {
              echo "STOP: wrong draft asset count for $tag" >&2
              exit 1
            }
            diff -u "$expected" "$actual"
            echo "PASS: complete draft $tag"
          }

          verify_draft "$X64_TAG" "$root/windows-x64/assets" 9
          verify_draft "$ARM64_TAG" "$root/windows-arm64/assets" 9
          verify_draft "$LINUX_X64_TAG" "$root/linux-x64/package" 6
          verify_draft "$LINUX_ARM64_TAG" "$root/linux-ARM64/package" 6
          echo "PASS: all four draft asset inventories match."

      - name: Publish all four releases only when explicitly requested
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RDT_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          X64_TAG: ${{ steps.verify.outputs.windows_x64_tag }}
          ARM64_TAG: ${{ steps.verify.outputs.windows_arm64_tag }}
          LINUX_X64_TAG: ${{ steps.verify.outputs.linux_x64_tag }}
          LINUX_ARM64_TAG: ${{ steps.verify.outputs.linux_arm64_tag }}
        run: |
          set -euo pipefail
          tags=("$X64_TAG" "$ARM64_TAG" "$LINUX_X64_TAG" "$LINUX_ARM64_TAG")
          promotion_marker="RDT-PROMOTION:${QUALIFICATION_RUN_ID}:${QUALIFICATION_RUN_ATTEMPT}:${SOURCE_SHA}"

          tag_commit_sha() {
            local tag="$1" ref_json object_type object_sha tag_json
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            if [[ "$object_type" == "tag" ]]; then
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<<"$tag_json")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
            fi
            [[ "$object_type" == "commit" && "$object_sha" == "$SOURCE_SHA" ]] || {
              echo "STOP: release tag does not resolve to qualified source SHA: $tag" >&2
              return 1
            }
          }

          verify_release_identity() {
            local tag="$1" release_json
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            jq -e --arg tag "$tag" --arg marker "$promotion_marker" '
              .tag_name == $tag and
              .prerelease == true and
              ((.body // "") | type == "string" and contains($marker))
            ' <<<"$release_json" >/dev/null || {
              echo "STOP: release marker or prerelease identity mismatch: $tag" >&2
              return 1
            }
            tag_commit_sha "$tag"
          }

          rollback_to_drafts() {
            local status=$?
            trap - ERR
            echo "WARNING: publication incomplete; attempting to restore all four releases to draft state." >&2
            for rollback_tag in "${tags[@]}"; do
              if ! verify_release_identity "$rollback_tag"; then
                echo "WARNING: refusing rollback without release ownership and source proof: $rollback_tag" >&2
                continue
              fi
              rollback_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$rollback_tag")" || continue
              jq -e '.draft == true' <<<"$rollback_release" >/dev/null && continue
              rollback_id="$(jq -r '.id' <<<"$rollback_release")"
              GH_TOKEN="$RELEASE_TOKEN" gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$rollback_id" -F draft=true >/dev/null ||
                echo "WARNING: could not restore $rollback_tag to draft; manual owner review required." >&2
            done
            exit "$status"
          }
          trap rollback_to_drafts ERR
          for tag in "${tags[@]}"; do
            verify_release_identity "$tag"
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            jq -e '.draft == true and .prerelease == true and (.assets | length > 0)' <<<"$release" >/dev/null || {
              echo "STOP: release is not a complete unpublished draft: $tag" >&2
              exit 1
            }
          done
          for tag in "${tags[@]}"; do
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')"
            GH_TOKEN="$RELEASE_TOKEN" gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false >/dev/null
            echo "Published $tag"
          done
          trap - ERR
          echo "PASS: all four verified platform releases published."

      - name: Leave verified drafts unpublished
        if: ${{ !inputs.publish_release }}
        shell: bash
        run: |
          echo "Four verified platform releases remain drafts."
          echo "Updater-feed publication was not triggered."
