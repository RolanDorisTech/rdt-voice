name: Verify GitHub Actions dependency lock

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - "backend/whisper_cpp/tests/test_windows_public_release_workflow_contract.py"
      - "**/action.yml"
      - "**/action.yaml"
  push:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - "backend/whisper_cpp/tests/test_windows_public_release_workflow_contract.py"
      - "**/action.yml"
      - "**/action.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pinned workflow dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out workflow sources
        uses: actions/checkout@v7.0.1
      - name: Run release and workflow reliability contract tests
        run: python3 -m unittest discover -s backend/whisper_cpp/tests -p test_windows_public_release_workflow_contract.py -v

      - name: Install pinned GitHub lockfile verifier
        run: gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify direct and transitive action dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify --fail-on-warning
