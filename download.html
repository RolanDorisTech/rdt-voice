<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Download the current eligible RDT Connect macOS installer.">
  <title>Download RDT Connect</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; }
    main { width: min(38rem, calc(100% - 3rem)); padding: 2rem 0; }
    .eyebrow { color: #facc15; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { line-height: 1.15; }
    p { line-height: 1.6; }
    a { color: #fde68a; }
    #status { padding: 1rem; border: 1px solid #4b5563; border-radius: .75rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">RDT Connect</p>
    <h1>Preparing your download</h1>
    <p id="status" role="status" aria-live="polite">
      Checking GitHub for the newest eligible Apple-silicon installer…
    </p>
    <p>If automatic download resolution is unavailable, you can
      <a href="https://github.com/RolanDorisTech/rdt-voice/releases">browse the RDT Connect release list</a>
      instead.
    </p>
  </main>
  <script src="./download.js" defer></script>
</body>
</html>
