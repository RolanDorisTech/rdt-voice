name: RDT Connect Linux Native Qualification (manual)

on:
  workflow_dispatch:
  # Run qualification when the isolated Dev 11 branch is updated. This only
  # builds/tests and uploads evidence; it does not publish or create releases.
  push:
    branches:
      - connect-linux-track2-dev11

permissions:
  contents: read

concurrency:
  group: rdt-connect-linux-native-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x64-native-qualification:
    name: Build and qualify Linux x64 (no publish)
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      CARGO_TERM_COLOR: always
      CI: "true"
      PYTHONUNBUFFERED: "1"
      MODEL_UI_ID: mlx-community/whisper-large-v3-turbo
      MODEL_LINUX_ID: large-v3-turbo
      WHISPER_CPP_PIN: d1be6fde11ac6e0407606b4e42fe72d34add8037
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native Linux build and audio dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake git pkg-config curl wget file \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev ffmpeg espeak-ng patchelf dpkg-dev
          mkdir -p "$RUNNER_TEMP/rdt-linux-qualification"
          {
            uname -a
            lsb_release -a 2>&1 || true
            rustc --version
            cargo --version
            node --version
            npm --version
            python3 --version
            ffmpeg -version | head -n 2
            cmake --version | head -n 1
            printf 'git commit: '
            git rev-parse HEAD
            printf 'git status:\n'
            git status --short
          } | tee "$RUNNER_TEMP/rdt-linux-qualification/environment.txt"

      - name: Create isolated qualification Python environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/rdt-python"
          "$RUNNER_TEMP/rdt-python/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/rdt-python/bin/python" -m pip install \
            "fastapi==0.162.0" \
            "uvicorn==0.54.0" \
            "python-multipart==0.0.32" \
            "qrcode==8.2" \
            "numpy==2.4.6" \
            "httpx==0.28.1" \
            "PyInstaller==6.16.0"
          "$RUNNER_TEMP/rdt-python/bin/python" -c \
            'import fastapi, starlette, uvicorn, multipart, qrcode, numpy, httpx, PyInstaller; print("qualification Python imports OK")'

      - name: Run Linux server regression suite
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rdt-linux-qualification"
          PYTHONTRACEMALLOC=3 "$RUNNER_TEMP/rdt-python/bin/python" \
            -W always::ResourceWarning backend/linux/tests/test_linux_transcription_regressions.py -v \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/linux-server-tests.log"
          PYTHONPATH=backend/whisper_cpp "$RUNNER_TEMP/rdt-python/bin/python" \
            backend/whisper_cpp/tests/test_model_registry.py -v \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/model-registry-tests.log"
          "$RUNNER_TEMP/rdt-python/bin/python" backend/whisper_cpp/tests/test_packaged_qualification.py -v \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/packaged-qualifier-model-root-tests.log"
          "$RUNNER_TEMP/rdt-python/bin/python" -m py_compile \
            backend/linux/server.py backend/whisper_cpp/engine.py \
            backend/whisper_cpp/model_registry.py \
            backend/whisper_cpp/qualification_support.py \
            backend/whisper_cpp/scripts/native_cpu_smoke.py \
            .github/scripts/qualify-packaged-linux-backend.py
          bash -n backend/linux/run-server.sh
          bash -n backend/whisper_cpp/scripts/build-linux-worker.sh
          bash -n rdt_connect/scripts/prepare-linux-bundle.sh
          git diff --check

      - name: Prepare embedded frontend resources for Rust tests
        run: |
          set -euo pipefail
          RESOURCE_ROOT="rdt_connect/src-tauri/resources"
          WEB="$RESOURCE_ROOT/rdt_voice_web"
          NOTICES="$RESOURCE_ROOT/third_party_notices"

          for path in "$WEB" "$NOTICES" "$RESOURCE_ROOT/rdt_voice_backend"; do
            if [[ -e "$path" ]]; then
              echo "STOP: Refusing to overwrite existing resource: $path" >&2
              exit 1
            fi
          done

          mkdir -p "$WEB" "$NOTICES/opencc-js"
          cp index.html worker.js pcm-worklet.js models.manifest.json "$WEB/"
          cp -R locales assets "$WEB/"
          cp -R licenses/third-party/opencc-js/. "$NOTICES/opencc-js/"

          cat > "$NOTICES/BUILD-NOTICES.md" <<'EOF'
          # RDT Connect Linux qualification resources

          The embedded RDT Voice frontend is sourced from the repository root.
          OpenCC-JS license materials are included in opencc-js/.
          The Linux backend is assembled separately by this qualification workflow.
          EOF

          for file in index.html worker.js pcm-worklet.js models.manifest.json; do
            test -s "$WEB/$file"
          done
          test -d "$WEB/locales"
          test -d "$WEB/assets"
          test -d "$NOTICES/opencc-js"
          test -s "$NOTICES/BUILD-NOTICES.md"

          echo "PASS: Embedded frontend and license resources prepared."

      - name: Run shared Rust Linux TLS tests
        run: |
          set -euo pipefail
          RESOURCE_ROOT="rdt_connect/src-tauri/resources"
          TEMP_BACKEND="$RESOURCE_ROOT/rdt_voice_backend"

          if [[ -e "$TEMP_BACKEND" ]]; then
            echo "STOP: Backend resource path already exists: $TEMP_BACKEND" >&2
            exit 1
          fi

          # Tauri validates configured resource paths during cargo test.
          # This temporary placeholder is removed on success or failure.
          trap 'rm -rf -- "$TEMP_BACKEND"' EXIT
          mkdir -p "$TEMP_BACKEND"
          printf '%s\n' \
            "Temporary Rust-test placeholder; never package this directory." \
            > "$TEMP_BACKEND/.qualification-placeholder"

          cargo test --locked --manifest-path rdt_connect/src-tauri/Cargo.toml \
            linux_tls::tests --no-fail-fast \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/linux-tls-tests.log"

      - name: Fetch and validate pinned whisper.cpp source
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/whisper.cpp"
          git clone --filter=blob:none https://github.com/ggerganov/whisper.cpp.git "$SRC"
          git -C "$SRC" checkout --detach "$WHISPER_CPP_PIN"
          git -C "$SRC" submodule update --init --recursive
          ACTUAL="$(git -C "$SRC" rev-parse HEAD)"
          test "$ACTUAL" = "$WHISPER_CPP_PIN"
          test -z "$(git -C "$SRC" status --porcelain --untracked-files=all)"
          {
            printf 'whisper_cpp_commit=%s\n' "$ACTUAL"
            git -C "$SRC" log -1 --format='%H%n%s'
            git -C "$SRC" submodule status --recursive
          } | tee "$RUNNER_TEMP/rdt-linux-qualification/whisper-source-pin.txt"
          RDT_BUILD_JOBS=2 bash backend/whisper_cpp/scripts/build-linux-worker.sh cpu "$SRC" \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/native-worker-build.log"
          WORKER=backend/whisper_cpp/bin/rdt_whisper_worker
          test -x "$WORKER"
          ldd "$WORKER" | tee "$RUNNER_TEMP/rdt-linux-qualification/native-worker-ldd.txt"
          if ldd "$WORKER" 2>&1 | grep -q 'not found'; then
            echo "STOP: native worker has unresolved shared-library dependencies." >&2
            exit 1
          fi
          sha256sum "$WORKER" | tee "$RUNNER_TEMP/rdt-linux-qualification/native-worker-sha256.txt"
          cp "$WORKER" "$RUNNER_TEMP/rdt-linux-qualification/rdt_whisper_worker"

      - name: Verify and cache the approved Large-v3-Turbo GGML artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rdt-models"
          RDT_GGML_MODEL_DIR="$RUNNER_TEMP/rdt-models" \
          WHISPER_MODEL_ID="$MODEL_UI_ID" \
            "$RUNNER_TEMP/rdt-python/bin/python" backend/linux/server.py \
              --download-model "$MODEL_UI_ID" \
              2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/model-download-verification.log"
          MODEL="$RUNNER_TEMP/rdt-models/ggml-large-v3-turbo-q5_0.bin"
          test -f "$MODEL"
          test -f "$MODEL.rdt-verified.json"
          sha256sum "$MODEL" | tee "$RUNNER_TEMP/rdt-linux-qualification/verified-model-sha256.txt"
          cp "$MODEL.rdt-verified.json" "$RUNNER_TEMP/rdt-linux-qualification/model-verification-sidecar.json"
          "$RUNNER_TEMP/rdt-python/bin/python" - "$MODEL" <<'PY'
          import pathlib, sys
          p=pathlib.Path(sys.argv[1])
          print(f"verified_model_file={p.name}")
          print(f"verified_model_size_bytes={p.stat().st_size}")
          PY

      - name: Generate deterministic English speech fixture
        run: |
          set -euo pipefail
          espeak-ng -v en-us -s 145 -w "$RUNNER_TEMP/rdt-linux-raw.wav" \
            "The quick brown fox jumps over the lazy dog. This is a real transcription test for RDT Connect."
          ffmpeg -hide_banner -loglevel error -y -i "$RUNNER_TEMP/rdt-linux-raw.wav" \
            -ac 1 -ar 16000 -c:a pcm_s16le "$RUNNER_TEMP/rdt-linux-qualification.wav"
          file "$RUNNER_TEMP/rdt-linux-qualification.wav" | tee "$RUNNER_TEMP/rdt-linux-qualification/fixture-file.txt"
          sha256sum "$RUNNER_TEMP/rdt-linux-qualification.wav" | tee "$RUNNER_TEMP/rdt-linux-qualification/fixture-sha256.txt"

      - name: Build one-folder Linux backend bundle
        run: |
          set -euo pipefail
          RDT_PYTHON="$RUNNER_TEMP/rdt-python/bin/python" \
            bash rdt_connect/scripts/prepare-linux-bundle.sh \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/backend-bundle-build.log"
          test -x rdt_connect/src-tauri/resources/rdt_voice_backend/rdt_voice_backend
          test -x rdt_connect/src-tauri/resources/rdt_voice_backend/rdt_whisper_worker
          sha256sum \
            rdt_connect/src-tauri/resources/rdt_voice_backend/rdt_voice_backend \
            rdt_connect/src-tauri/resources/rdt_voice_backend/rdt_whisper_worker \
            | tee "$RUNNER_TEMP/rdt-linux-qualification/bundled-executable-sha256.txt"

      - name: Install locked frontend dependencies
        working-directory: rdt_connect
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            corepack pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            PM="$(node -p "require('./package.json').packageManager || ''")"
            if [[ "$PM" == yarn@1* ]]; then
              corepack yarn install --frozen-lockfile
            else
              corepack yarn install --immutable
            fi
          else
            echo "STOP: no npm/pnpm/yarn lockfile; reproducible frontend install is unavailable." >&2
            exit 1
          fi
          test -x node_modules/.bin/tauri || {
            echo "STOP: local Tauri CLI was not installed from the project lockfile." >&2
            exit 1
          }

      - name: Build the Linux Debian package (no publish)
        run: |
          set -euo pipefail
          test -d rdt_connect/src-tauri/resources/third_party_notices
          test -f rdt_connect/src-tauri/resources/rdt_voice_web/index.html
          test -f rdt_connect/src-tauri/resources/rdt_voice_web/worker.js
          (cd rdt_connect && npx --no-install tauri build --config src-tauri/tauri.linux.conf.json --bundles deb --verbose) \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/tauri-linux-build.log"
          DEB="$(find rdt_connect/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB" | tee "$RUNNER_TEMP/rdt-linux-qualification/deb-info.txt"
          mkdir -p "$RUNNER_TEMP/rdt-linux-deb-root"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/rdt-linux-deb-root"
          printf '%s\n' "$DEB" > "$RUNNER_TEMP/rdt-linux-qualification/deb-path.txt"
          find "$RUNNER_TEMP/rdt-linux-deb-root" -type f \
            \( -path '*/rdt_voice_backend/rdt_voice_backend' \
               -o -path '*/rdt_voice_backend/rdt_whisper_worker' \
               -o -path '*/rdt_voice_web/index.html' \
               -o -path '*/rdt_voice_web/worker.js' \) \
            -print | sort | tee "$RUNNER_TEMP/rdt-linux-qualification/packaged-resource-paths.txt"
          grep -q '/rdt_voice_backend/rdt_voice_backend$' "$RUNNER_TEMP/rdt-linux-qualification/packaged-resource-paths.txt"
          grep -q '/rdt_voice_backend/rdt_whisper_worker$' "$RUNNER_TEMP/rdt-linux-qualification/packaged-resource-paths.txt"
          grep -q '/rdt_voice_web/index.html$' "$RUNNER_TEMP/rdt-linux-qualification/packaged-resource-paths.txt"
          mkdir -p "$RUNNER_TEMP/rdt-linux-qualification/package"
          cp "$DEB" "$RUNNER_TEMP/rdt-linux-qualification/package/"

      - name: One bounded real inference through the packaged API
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rdt-linux-deb-root"
          BACKEND="$(find "$ROOT" -type f -path '*/rdt_voice_backend/rdt_voice_backend' -print -quit)"
          WORKER="$(find "$ROOT" -type f -path '*/rdt_voice_backend/rdt_whisper_worker' -print -quit)"
          FRONTEND="$(find "$ROOT" -type f -path '*/rdt_voice_web/index.html' -print -quit)"
          test -n "$BACKEND" && test -n "$WORKER" && test -n "$FRONTEND"
          FRONTEND_DIR="$(dirname "$FRONTEND")"
          "$RUNNER_TEMP/rdt-python/bin/python" .github/scripts/qualify-packaged-linux-backend.py \
            --backend "$BACKEND" \
            --worker "$WORKER" \
            --frontend-dir "$FRONTEND_DIR" \
            --model-dir "$RUNNER_TEMP/rdt-models" \
            --fixture "$RUNNER_TEMP/rdt-linux-qualification.wav" \
            --output-json "$RUNNER_TEMP/rdt-linux-qualification/real-inference-timing.json" \
            --model-id "$MODEL_UI_ID" \
            --timeout-seconds 900 \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/packaged-api-inference.log"

      - name: Upload qualification evidence and Linux package (never model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-connect-dev11-linux-qualification-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rdt-linux-qualification/**
