name: RDT Connect Linux Native Qualification (manual)

on:
  workflow_dispatch:
  # Run qualification when the isolated Dev 11 branch is updated. This only
  # builds/tests and uploads evidence; it does not publish or create releases.
  push:
    branches:
      - connect-linux-track2-dev11
      - windows-linux-dev11-parity-20261028
      - linux-qualification-audit-candidate-20261028

permissions:
  contents: read

concurrency:
  group: rdt-connect-linux-native-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  updater-contract:
    name: Fast Linux updater artifact contract
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Tauri updater configuration
        shell: bash
        run: |
          python3 - <<'PYCONTRACT'
          import json
          from pathlib import Path

          config = json.loads(Path("rdt_connect/src-tauri/tauri.conf.json").read_text())
          bundle = config.get("bundle", {})
          updater = config.get("plugins", {}).get("updater", {})
          assert bundle.get("createUpdaterArtifacts") is True, "Updater artifacts must remain enabled"
          assert isinstance(updater.get("pubkey"), str) and updater["pubkey"].strip(), "Updater public key is missing"
          workflow = Path(".github/workflows/linux-native-qualification.yml").read_text()
          assert "--bundles deb" in workflow, "Linux qualification must build a Debian package"
          print("PASS: Linux updater/package configuration contract")
          PYCONTRACT

  signing-preflight:
    needs: updater-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies for signing probe
        working-directory: rdt_connect
        run: npm ci
      - name: Verify approved updater signing key and sign probe
        working-directory: rdt_connect
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_SHA256: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "STOP: updater private-key secret is empty or unavailable." >&2
            exit 1
          fi
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_SHA256:-}" ]]; then
            echo "STOP: approved updater private-key fingerprint secret is missing." >&2
            exit 1
          fi
          actual="$(python3 -c 'import hashlib, os; print(hashlib.sha256(os.environ["TAURI_SIGNING_PRIVATE_KEY"].strip().encode()).hexdigest())')"
          expected="${TAURI_SIGNING_PRIVATE_KEY_SHA256//[[:space:]]/}"
          if [[ "${actual,,}" != "${expected,,}" ]]; then
            echo "STOP: updater private key does not match the approved SHA-256 fingerprint." >&2
            exit 1
          fi
          probe="$RUNNER_TEMP/rdt-updater-signing-preflight.txt"
          trap 'rm -f "$probe" "$probe.sig"' EXIT
          printf '%s' 'RDT updater signing preflight' > "$probe"
          npm run tauri -- signer sign "$probe"
          test -s "$probe.sig" || {
            echo "STOP: Tauri produced no non-empty signing probe." >&2
            exit 1
          }
          echo "PASS: updater signing preflight"

  linux-native-qualification:
    needs: signing-preflight
    name: Build and qualify Linux ${{ matrix.arch }} (no publish)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            marker: 5L001
          - arch: ARM64
            runner: ubuntu-24.04-arm
            marker: 4L001
    env:
      BUILD_MARKER: ${{ matrix.marker }}
      BUILD_ARCH: ${{ matrix.arch }}
      CARGO_TERM_COLOR: always
      CI: "true"
      PYTHONUNBUFFERED: "1"
      MODEL_UI_ID: mlx-community/whisper-large-v3-turbo
      MODEL_LINUX_ID: large-v3-turbo
      WHISPER_CPP_PIN: d1be6fde11ac6e0407606b4e42fe72d34add8037
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Stamp isolated Linux build version
        run: |
          set -euo pipefail
          node rdt_connect/scripts/stamp-platform-build.cjs linux "$BUILD_MARKER"
          echo "Architecture=$BUILD_ARCH marker=$BUILD_MARKER"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native Linux build and audio dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake git pkg-config curl wget file \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev ffmpeg espeak-ng patchelf dpkg-dev
          mkdir -p "$RUNNER_TEMP/rdt-linux-qualification"
          {
            uname -a
            lsb_release -a 2>&1 || true
            rustc --version
            cargo --version
            node --version
            npm --version
            python3 --version
            ffmpeg -version | head -n 2
            cmake --version | head -n 1
            printf 'git commit: '
            git rev-parse HEAD
            printf 'git status:\n'
            git status --short
          } | tee "$RUNNER_TEMP/rdt-linux-qualification/environment.txt"

      - name: Create isolated qualification Python environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/rdt-python"
          "$RUNNER_TEMP/rdt-python/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/rdt-python/bin/python" -m pip install \
            -r backend/linux/requirements-linux.txt
          "$RUNNER_TEMP/rdt-python/bin/python" -m pip check
          "$RUNNER_TEMP/rdt-python/bin/python" -c \
            'import fastapi, starlette, uvicorn, multipart, qrcode, numpy, httpx, backports.tarfile, PyInstaller; print("qualification Python imports OK")'

      - name: Run Linux server regression suite
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rdt-linux-qualification"
          PYTHONTRACEMALLOC=3 "$RUNNER_TEMP/rdt-python/bin/python" \
            -W always::ResourceWarning backend/linux/tests/test_linux_transcription_regressions.py -v \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/linux-server-tests.log"
          PYTHONPATH=backend/whisper_cpp "$RUNNER_TEMP/rdt-python/bin/python" \
            backend/whisper_cpp/tests/test_model_registry.py -v \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/model-registry-tests.log"
          "$RUNNER_TEMP/rdt-python/bin/python" backend/linux/tests/test_python_qualification.py -v \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/python-qualification-tests.log"
          "$RUNNER_TEMP/rdt-python/bin/python" -m py_compile \
            backend/linux/server.py backend/whisper_cpp/engine.py \
            backend/whisper_cpp/model_registry.py \
            backend/whisper_cpp/qualification_support.py \
            backend/whisper_cpp/scripts/native_cpu_smoke.py \
            .github/scripts/qualify-packaged-linux-backend.py
          bash -n backend/linux/run-server.sh
          bash -n backend/whisper_cpp/scripts/build-linux-worker.sh
          bash -n rdt_connect/scripts/prepare-linux-bundle.sh
          git diff --check

      - name: Prepare embedded frontend resources for Rust tests
        run: |
          set -euo pipefail
          RESOURCE_ROOT="rdt_connect/src-tauri/resources"
          WEB="$RESOURCE_ROOT/rdt_voice_web"
          NOTICES="$RESOURCE_ROOT/third_party_notices"

          for path in "$WEB" "$NOTICES" "$RESOURCE_ROOT/rdt_voice_backend"; do
            if [[ -e "$path" ]]; then
              echo "STOP: Refusing to overwrite existing resource: $path" >&2
              exit 1
            fi
          done

          mkdir -p "$WEB" "$NOTICES/opencc-js"
          cp index.html worker.js pcm-worklet.js models.manifest.json "$WEB/"
          cp -R locales assets "$WEB/"
          cp -R licenses/third-party/opencc-js/. "$NOTICES/opencc-js/"

          cat > "$NOTICES/BUILD-NOTICES.md" <<'EOF'
          # RDT Connect Linux qualification resources

          The embedded RDT Voice frontend is sourced from the repository root.
          OpenCC-JS license materials are included in opencc-js/.
          The Linux backend is assembled separately by this qualification workflow.
          EOF

          for file in index.html worker.js pcm-worklet.js models.manifest.json; do
            test -s "$WEB/$file"
          done
          test -d "$WEB/locales"
          test -d "$WEB/assets"
          test -d "$NOTICES/opencc-js"
          test -s "$NOTICES/BUILD-NOTICES.md"

          echo "PASS: Embedded frontend and license resources prepared."

      - name: Run shared Rust Linux TLS tests
        run: |
          set -euo pipefail
          RESOURCE_ROOT="rdt_connect/src-tauri/resources"
          TEMP_BACKEND="$RESOURCE_ROOT/rdt_voice_backend"

          if [[ -e "$TEMP_BACKEND" ]]; then
            echo "STOP: Backend resource path already exists: $TEMP_BACKEND" >&2
            exit 1
          fi

          # Tauri validates configured resource paths during cargo test.
          # This temporary placeholder is removed on success or failure.
          trap 'rm -rf -- "$TEMP_BACKEND"' EXIT
          mkdir -p "$TEMP_BACKEND"
          printf '%s\n' \
            "Temporary Rust-test placeholder; never package this directory." \
            > "$TEMP_BACKEND/.qualification-placeholder"

          cargo test --locked --manifest-path rdt_connect/src-tauri/Cargo.toml \
            linux_tls::tests --no-fail-fast \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/linux-tls-tests.log"

      - name: Fetch and validate pinned whisper.cpp source
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/whisper.cpp"
          git clone --filter=blob:none https://github.com/ggerganov/whisper.cpp.git "$SRC"
          git -C "$SRC" checkout --detach "$WHISPER_CPP_PIN"
          git -C "$SRC" submodule update --init --recursive
          ACTUAL="$(git -C "$SRC" rev-parse HEAD)"
          test "$ACTUAL" = "$WHISPER_CPP_PIN"
          test -z "$(git -C "$SRC" status --porcelain --untracked-files=all)"
          {
            printf 'whisper_cpp_commit=%s\n' "$ACTUAL"
            git -C "$SRC" log -1 --format='%H%n%s'
            git -C "$SRC" submodule status --recursive
          } | tee "$RUNNER_TEMP/rdt-linux-qualification/whisper-source-pin.txt"
          RDT_BUILD_JOBS=2 bash backend/whisper_cpp/scripts/build-linux-worker.sh cpu "$SRC" \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/native-worker-build.log"
          WORKER=backend/whisper_cpp/bin/rdt_whisper_worker
          test -x "$WORKER"
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            BUILD_DIR=backend/whisper_cpp/.build-linux-cpu
            cp "$BUILD_DIR/compile_commands.json" "$RUNNER_TEMP/rdt-linux-qualification/x64-compile-commands.json"
            cp "$BUILD_DIR/CMakeCache.txt" "$RUNNER_TEMP/rdt-linux-qualification/x64-cmake-cache.txt"
            {
              echo "=== uname ==="
              uname -a
              echo "=== CPU ==="
              lscpu
              echo "=== cgroup CPU limits ==="
              for f in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/cpuset.cpus.effective; do
                if [[ -r "$f" ]]; then echo "--- $f"; cat "$f"; fi
              done
            } > "$RUNNER_TEMP/rdt-linux-qualification/x64-cpu-diagnostics.txt"
          fi
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            BUILD_DIR=backend/whisper_cpp/.build-linux-cpu
            CACHE="$BUILD_DIR/CMakeCache.txt"
            COMPILE_COMMANDS="$BUILD_DIR/compile_commands.json"
            test -s "$CACHE"
            test -s "$COMPILE_COMMANDS"
            for feature in SSE42 AVX AVX_VNNI AVX2 BMI2 FMA F16C AVX512 AVX512_VBMI AVX512_VNNI AVX512_BF16 AMX_TILE AMX_INT8 AMX_BF16; do
              grep -Fxq "GGML_${feature}:BOOL=OFF" "$CACHE" || {
                echo "STOP: generic x64 worker has GGML_${feature} enabled or unset." >&2
                exit 1
              }
            done
            if grep -Eq -- '-m(sse3|ssse3|sse4\.1|sse4\.2|avx[^[:space:],"]*|f16c|fma[^[:space:],"]*|bmi[^[:space:],"]*|popcnt|lzcnt|aes|pclmul|sha[^[:space:],"]*|vaes|vpclmulqdq|gfni|amx[^[:space:],"]*)' "$COMPILE_COMMANDS"; then
              echo "STOP: generic x64 worker compile commands enable an optional x86 ISA flag." >&2
              exit 1
            fi
            if grep -Eq -- '(^|[[:space:],"])-(march|mcpu)=' "$COMPILE_COMMANDS"; then
              echo "STOP: generic x64 worker explicitly sets -march/-mcpu; expected compiler-default x86-64-v1 baseline." >&2
              exit 1
            fi
            echo "PASS: generic x64 worker is configured for x86-64-v1; optional x86 ISA flags are absent."
          fi
          ldd "$WORKER" | tee "$RUNNER_TEMP/rdt-linux-qualification/native-worker-ldd.txt"
          if ldd "$WORKER" 2>&1 | grep -q 'not found'; then
            echo "STOP: native worker has unresolved shared-library dependencies." >&2
            exit 1
          fi
          sha256sum "$WORKER" | tee "$RUNNER_TEMP/rdt-linux-qualification/native-worker-sha256.txt"
          cp "$WORKER" "$RUNNER_TEMP/rdt-linux-qualification/rdt_whisper_worker"
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            RDT_BUILD_JOBS=2 bash backend/whisper_cpp/scripts/build-linux-worker.sh avx2 "$SRC" \
              2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/native-worker-avx2-build.log"
            AVX2_BUILD=backend/whisper_cpp/.build-linux-avx2
            AVX2_WORKER=backend/whisper_cpp/bin/rdt_whisper_worker_avx2
            test -x "$AVX2_WORKER"
            grep -q '^GGML_AVX2:BOOL=ON$' "$AVX2_BUILD/CMakeCache.txt"
            grep -q '^GGML_FMA:BOOL=ON$' "$AVX2_BUILD/CMakeCache.txt"
            python3 - "$AVX2_BUILD/compile_commands.json" <<'PYAVX'
import json, sys
from pathlib import Path
commands = json.loads(Path(sys.argv[1]).read_text())
cpu = [x["command"] for x in commands if "/ggml-cpu/" in x["file"] or "ggml-cpu" in x["file"]]
assert cpu, "No ggml-cpu compile commands found"
assert any("-mavx2" in x and "-mfma" in x for x in cpu), "AVX2/FMA flags missing from ggml-cpu compilation"
print(f"PASS: AVX2/FMA flags present in {len(cpu)} ggml-cpu compile commands")
PYAVX
            ldd "$AVX2_WORKER" | tee "$RUNNER_TEMP/rdt-linux-qualification/avx2-ldd.txt"
            ! grep -q 'not found' "$RUNNER_TEMP/rdt-linux-qualification/avx2-ldd.txt"
            sha256sum "$AVX2_WORKER" | tee "$RUNNER_TEMP/rdt-linux-qualification/avx2-worker-sha256.txt"
          fi

      - name: Verify and cache the approved Large-v3-Turbo GGML artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rdt-models"
          RDT_GGML_MODEL_DIR="$RUNNER_TEMP/rdt-models" \
          WHISPER_MODEL_ID="$MODEL_UI_ID" \
            "$RUNNER_TEMP/rdt-python/bin/python" backend/linux/server.py \
              --download-model "$MODEL_UI_ID" \
              2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/model-download-verification.log"
          MODEL="$RUNNER_TEMP/rdt-models/ggml-large-v3-turbo-q5_0.bin"
          test -f "$MODEL"
          test -f "$MODEL.rdt-verified.json"
          sha256sum "$MODEL" | tee "$RUNNER_TEMP/rdt-linux-qualification/verified-model-sha256.txt"
          cp "$MODEL.rdt-verified.json" "$RUNNER_TEMP/rdt-linux-qualification/model-verification-sidecar.json"
          "$RUNNER_TEMP/rdt-python/bin/python" - "$MODEL" <<'PY'
          import pathlib, sys
          p=pathlib.Path(sys.argv[1])
          print(f"verified_model_file={p.name}")
          print(f"verified_model_size_bytes={p.stat().st_size}")
          PY

      - name: Generate deterministic English speech fixture
        run: |
          set -euo pipefail
          espeak-ng -v en-us -s 145 -w "$RUNNER_TEMP/rdt-linux-raw.wav" \
            "The quick brown fox jumps over the lazy dog. This is a real transcription test for RDT Connect."
          ffmpeg -hide_banner -loglevel error -y -i "$RUNNER_TEMP/rdt-linux-raw.wav" \
            -ac 1 -ar 16000 -c:a pcm_s16le "$RUNNER_TEMP/rdt-linux-qualification.wav"
          file "$RUNNER_TEMP/rdt-linux-qualification.wav" | tee "$RUNNER_TEMP/rdt-linux-qualification/fixture-file.txt"
          sha256sum "$RUNNER_TEMP/rdt-linux-qualification.wav" | tee "$RUNNER_TEMP/rdt-linux-qualification/fixture-sha256.txt"

      - name: Build one-folder Linux backend bundle
        run: |
          set -euo pipefail
          RDT_PYTHON="$RUNNER_TEMP/rdt-python/bin/python" \
            bash rdt_connect/scripts/prepare-linux-bundle.sh \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/backend-bundle-build.log"
          test -x rdt_connect/src-tauri/resources/rdt_voice_backend/rdt_voice_backend
          test -x rdt_connect/src-tauri/resources/rdt_voice_backend/rdt_whisper_worker
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            test -x rdt_connect/src-tauri/resources/rdt_voice_backend/rdt_whisper_worker_avx2
          fi
          sha256sum rdt_connect/src-tauri/resources/rdt_voice_backend/rdt_voice_backend \
            rdt_connect/src-tauri/resources/rdt_voice_backend/rdt_whisper_worker* \
            | tee "$RUNNER_TEMP/rdt-linux-qualification/bundled-executable-sha256.txt"

      - name: Install locked frontend dependencies
        working-directory: rdt_connect
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            corepack pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            PM="$(node -p "require('./package.json').packageManager || ''")"
            if [[ "$PM" == yarn@1* ]]; then
              corepack yarn install --frozen-lockfile
            else
              corepack yarn install --immutable
            fi
          else
            echo "STOP: no npm/pnpm/yarn lockfile; reproducible frontend install is unavailable." >&2
            exit 1
          fi
          test -x node_modules/.bin/tauri || {
            echo "STOP: local Tauri CLI was not installed from the project lockfile." >&2
            exit 1
          }

      - name: Build the Linux Debian package (no publish)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -d rdt_connect/src-tauri/resources/third_party_notices
          test -f rdt_connect/src-tauri/resources/rdt_voice_web/index.html
          test -f rdt_connect/src-tauri/resources/rdt_voice_web/worker.js
          (cd rdt_connect && npx --no-install tauri build --config src-tauri/tauri.linux.conf.json --bundles deb --verbose) \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/tauri-linux-build.log"
          DEB="$(find rdt_connect/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB" | tee "$RUNNER_TEMP/rdt-linux-qualification/deb-info.txt"
          mkdir -p "$RUNNER_TEMP/rdt-linux-deb-root"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/rdt-linux-deb-root"
          printf '%s\n' "$DEB" > "$RUNNER_TEMP/rdt-linux-qualification/deb-path.txt"
          find "$RUNNER_TEMP/rdt-linux-deb-root" -type f \
            \( -path '*/rdt_voice_backend/rdt_voice_backend' \
               -o -path '*/rdt_voice_backend/rdt_whisper_worker' \
               -o -path '*/rdt_voice_backend/rdt_whisper_worker_avx2' \
               -o -path '*/rdt_voice_web/index.html' \
               -o -path '*/rdt_voice_web/worker.js' \) \
            -print | sort | tee "$RUNNER_TEMP/rdt-linux-qualification/packaged-resource-paths.txt"
          grep -q '/rdt_voice_backend/rdt_voice_backend$' "$RUNNER_TEMP/rdt-linux-qualification/packaged-resource-paths.txt"
          grep -q '/rdt_voice_backend/rdt_whisper_worker$' "$RUNNER_TEMP/rdt-linux-qualification/packaged-resource-paths.txt"
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            grep -q '/rdt_voice_backend/rdt_whisper_worker_avx2$' "$RUNNER_TEMP/rdt-linux-qualification/packaged-resource-paths.txt"
          fi
          grep -q '/rdt_voice_web/index.html$' "$RUNNER_TEMP/rdt-linux-qualification/packaged-resource-paths.txt"
          BACKEND_EXE="$(find "$RUNNER_TEMP/rdt-linux-deb-root" -type f -path '*/rdt_voice_backend/rdt_voice_backend' -print -quit)"
          test -n "$BACKEND_EXE"
          BACKEND_DIR="$(dirname "$BACKEND_EXE")"
          find "$BACKEND_DIR" -maxdepth 1 -type f -name 'rdt_whisper_worker*' -printf '%f\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/rdt-linux-qualification/packaged-worker-inventory.txt"
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            printf '%s\n' rdt_whisper_worker rdt_whisper_worker_avx2 > "$RUNNER_TEMP/rdt-linux-qualification/expected-packaged-worker-inventory.txt"
          else
            printf '%s\n' rdt_whisper_worker > "$RUNNER_TEMP/rdt-linux-qualification/expected-packaged-worker-inventory.txt"
          fi
          diff -u \
            "$RUNNER_TEMP/rdt-linux-qualification/expected-packaged-worker-inventory.txt" \
            "$RUNNER_TEMP/rdt-linux-qualification/packaged-worker-inventory.txt"
          mkdir -p "$RUNNER_TEMP/rdt-linux-qualification/package"
          cp "$DEB" "$RUNNER_TEMP/rdt-linux-qualification/package/"

      - name: One bounded real inference through the packaged API
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rdt-linux-deb-root"
          BACKEND="$(find "$ROOT" -type f -path '*/rdt_voice_backend/rdt_voice_backend' -print -quit)"
          WORKER="$(find "$ROOT" -type f -path '*/rdt_voice_backend/rdt_whisper_worker' -print -quit)"
          FRONTEND="$(find "$ROOT" -type f -path '*/rdt_voice_web/index.html' -print -quit)"
          test -n "$BACKEND" && test -n "$WORKER" && test -n "$FRONTEND"
          FRONTEND_DIR="$(dirname "$FRONTEND")"
          "$RUNNER_TEMP/rdt-python/bin/python" .github/scripts/qualify-packaged-linux-backend.py \
            --backend "$BACKEND" \
            --worker "$WORKER" \
            --frontend-dir "$FRONTEND_DIR" \
            --model-dir "$RUNNER_TEMP/rdt-models" \
            --fixture "$RUNNER_TEMP/rdt-linux-qualification.wav" \
            --output-json "$RUNNER_TEMP/rdt-linux-qualification/real-inference-timing.json" \
            --model-id "$MODEL_UI_ID" \
            --timeout-seconds 900 \
            --expected-worker-variant cpu \
            2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/packaged-api-inference-cpu.log"
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            AVX2_WORKER="$(find "$ROOT" -type f -path '*/rdt_voice_backend/rdt_whisper_worker_avx2' -print -quit)"
            test -n "$AVX2_WORKER"
            "$RUNNER_TEMP/rdt-python/bin/python" .github/scripts/qualify-packaged-linux-backend.py \
              --backend "$BACKEND" \
              --worker "$AVX2_WORKER" \
              --frontend-dir "$FRONTEND_DIR" \
              --model-dir "$RUNNER_TEMP/rdt-models" \
              --fixture "$RUNNER_TEMP/rdt-linux-qualification.wav" \
              --output-json "$RUNNER_TEMP/rdt-linux-qualification/real-inference-timing-avx2.json" \
              --model-id "$MODEL_UI_ID" \
              --timeout-seconds 900 \
              --expected-worker-variant x64-avx2 \
              2>&1 | tee "$RUNNER_TEMP/rdt-linux-qualification/packaged-api-inference-avx2.log"
            "$RUNNER_TEMP/rdt-python/bin/python" - \
              "$RUNNER_TEMP/rdt-linux-qualification/real-inference-timing.json" \
              "$RUNNER_TEMP/rdt-linux-qualification/real-inference-timing-avx2.json" <<'PYBENCH'
import json, sys
from pathlib import Path

baseline = json.loads(Path(sys.argv[1]).read_text())
optimized = json.loads(Path(sys.argv[2]).read_text())
base_ms = float(baseline["elapsed_ms_total"])
avx_ms = float(optimized["elapsed_ms_total"])
if base_ms <= 0 or avx_ms <= 0:
    raise SystemExit("STOP: invalid inference timing")
speedup = base_ms / avx_ms
print(f"portable_cpu_elapsed_ms={base_ms:.1f}")
print(f"x64_avx2_elapsed_ms={avx_ms:.1f}")
print(f"x64_avx2_speedup={speedup:.2f}x")
print(f"portable_cpu_rtf={baseline.get('real_time_factor', 'missing')}")
print(f"x64_avx2_rtf={optimized.get('real_time_factor', 'missing')}")
if avx_ms >= base_ms:
    raise SystemExit("STOP: AVX2 worker did not beat portable CPU baseline")
PYBENCH
          fi

      - name: Upload qualification evidence and Linux package (never model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdt-connect-dev11-linux-${{ matrix.arch }}-qualification-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rdt-linux-qualification/**
