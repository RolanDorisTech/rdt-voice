name: RDT Connect Windows Port Check

on:
  workflow_dispatch:
  push:
    branches:
      - "windows-port-*"
    paths:
      - "rdt_connect/**"
      - "backend/**"
      - ".github/workflows/windows-port-check.yml"
  pull_request:
    paths:
      - "rdt_connect/**"
      - "backend/**"
      - ".github/workflows/windows-port-check.yml"

permissions:
  contents: read

jobs:
  windows-x64-check:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rdt_connect/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: rdt_connect
        run: npm ci

      - name: Build frontend
        working-directory: rdt_connect
        run: npm run build

      - name: Test build versioning
        working-directory: rdt_connect
        run: npm run test:versioning

      - name: Compile native Windows app (no installer yet)
        working-directory: rdt_connect
        run: npx tauri build --config src-tauri/tauri.windows.check.conf.json --no-bundle
