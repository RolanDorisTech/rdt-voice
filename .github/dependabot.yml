version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: /rdt_connect
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: cargo
    directory: /rdt_connect/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: pip
    directory: /backend/linux
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: pip
    directory: /backend/windows
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
