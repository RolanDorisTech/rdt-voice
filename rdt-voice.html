function fmtSRT(s){if(!isFinite(s)) s=0; const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=Math.floor(s%60); const ms=Math.floor((s%1)*1000); return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")+","+String(ms).padStart(3,"0");}
function fmtYTPrecise(s){if(!isFinite(s)) s=0; const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=Math.floor(s%60); const cs=Math.floor((s%1)*100); if(h>0) return h+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")+"."+String(cs).padStart(2,"0"); return m+":"+String(sec).padStart(2,"0")+"."+String(cs).padStart(2,"0");}
function fmtYTFullMs(s){if(!isFinite(s)) s=0; const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=Math.floor(s%60); const ms=Math.floor((s%1)*1000); if(h>0) return h+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")+"."+String(ms).padStart(3,"0"); return m+":"+String(sec).padStart(2,"0")+"."+String(ms).padStart(3,"0");}
function fmtInput(s){if(!isFinite(s)) s=0; const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=s%60; if(h>0) return h+":"+String(m).padStart(2,"0")+":"+sec.toFixed(3).padStart(6,"0"); return m+":"+sec.toFixed(3).padStart(6,"0");}
function fmtTotal(sec){if(!sec||sec<=0) return "—"; sec=Math.floor(sec); const h=Math.floor(sec/3600); const m=Math.floor((sec%3600)/60); const s=sec%60; if(h>0) return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); if(m>0) return m+":"+String(s).padStart(2,"0"); return s+"s";}
function fmtSize(bytes){ const b = typeof bytes==="string" ? parseInt(bytes,10) : Number(bytes); if(!b || isNaN(b) || b===0) return "—"; if(b<100) return "—"; if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(1)+" KB"; return (b/1024/1024).toFixed(2)+" MB";}
function fmtTimeAgo(ts){
  try{
    const now=Date.now();
    const t=new Date(ts).getTime();
    const diff=Math.floor((now-t)/1000);
    if(diff<60) return diff+"s ago";
    if(diff<3600) return Math.floor(diff/60)+"m ago";
    if(diff<86400) return Math.floor(diff/3600)+"h "+Math.floor((diff%3600)/60)+"m ago";
    if(diff<604800) return Math.floor(diff/86400)+"d ago";
    return Math.floor(diff/604800)+"w ago";
  }catch{ return ""; }
}
function getFormatLabel(mime){const t=(mime||"").toLowerCase(); if(t.includes("wav")) return "wav"; if(t.includes("mp3")) return "mp3"; if(t.includes("mp4")) return "mp4"; if(t.includes("webm")) return "webm"; if(t.includes("ogg")) return "ogg"; return "webm";}
function estimateSegsFromText(text){
  const t=(text||"").trim();
  if(!t) return [];
  const parts=t.split(/([.!?]+\s+)/);
  let sentences=[];
  let buf="";
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    if(!p) continue;
    buf+=p;
    if(/[.!?]+\s+$/.test(p) || i===parts.length-1){
      if(buf.trim()) sentences.push(buf.trim());
      buf="";
    }
  }
  if(sentences.length===0){
    const words=t.split(/\s+/).filter(Boolean);
    sentences=words;
  }
  let cur=0;
  return sentences.map(w=>{
    const clean=(w||"").trim();
    if(!clean) return null;
    const d=Math.max(1.2,Math.min(6,clean.length/12));
    const s={start:cur,end:cur+d,text:clean};
    cur+=d;
    return s;
  }).filter(Boolean);
}
function getFillerStats(text){const fillers=["um","uh","like","you know","so","actually","basically","literally","kind of","sort of","i mean"]; const lower=text.toLowerCase(); let counts={}; let total=0; fillers.forEach(f=>{const re=new RegExp("\\b"+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"\\b","gi"); const m=lower.match(re); if(m){counts[f]=m.length; total+=m.length;}}); return {counts,total};}
function getKeywords(text, n=8){const stop=new Set(["the","and","you","that","have","with","this","will","your","from","they","what","are","was","for","but","not","can","all","our","just","about","more","when","also","very","been","would","there","their","them","then","than","into","some","only","over","even"]); const words=text.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>3 && !stop.has(w)); const freq={}; words.forEach(w=>freq[w]=(freq[w]||0)+1); return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([w,c])=>({word:w,count:c}));}
