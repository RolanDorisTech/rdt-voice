name: RDT Connect Windows ARM64 Test Installer

on:
  workflow_call:
  push:
    branches:
      - "windows-port-*"
    paths:
      - ".github/workflows/windows-arm64-installer.yml"
      - "rdt_connect/**"
      - "backend/**"
      - "index.html"
      - "worker.js"
      - "pcm-worklet.js"
      - "models.manifest.json"
      - "locales/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-contract:
    name: Fast Windows updater artifact contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Validate Tauri updater artifact contract
        shell: bash
        run: |
          python3 - <<'PYCONTRACT'
          import json
          from pathlib import Path

          config = json.loads(Path("rdt_connect/src-tauri/tauri.windows.conf.json").read_text())
          workflow = Path(".github/workflows/windows-arm64-installer.yml").read_text()
          assert config.get("bundle", {}).get("createUpdaterArtifacts") is True, "Tauri updater artifacts must be enabled"
          assert "*-setup.exe" in workflow, "Workflow must verify the actual NSIS setup executable"
          assert '"$($installer.FullName).sig"' in workflow, "Workflow must verify the matching installer signature"
          assert "$signature.sha256" in workflow, "Distribution must include the signature checksum"
          print("PASS: Tauri v2 NSIS updater artifact contract")
          PYCONTRACT

  build-cuda-arm64-worker:
    name: Cross-build verified Windows ARM64 CUDA worker
    needs: updater-contract
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up x64 Python for pinned source verification
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13.16'
          architecture: 'x64'
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Ninja installation failed: $LASTEXITCODE" }
          }
          ninja --version
      - name: Build and verify ARM64 CUDA worker on x64 host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/build-windows-arm64-cuda-worker.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP\rdt-windows-arm64-cuda"
      - name: Upload verified ARM64 CUDA worker
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rdt-windows-arm64-cuda-worker
          path: |
            ${{ runner.temp }}/rdt-windows-arm64-cuda/rdt_whisper_worker_cuda.exe
            ${{ runner.temp }}/rdt-windows-arm64-cuda/rdt_whisper_worker_cuda.manifest.json
          if-no-files-found: error
          retention-days: 3

  signing-preflight:
    needs: updater-contract
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install dependencies for signing probe
        working-directory: rdt_connect
        shell: pwsh
        run: npm ci
      - name: Preflight updater signing secrets
        working-directory: rdt_connect
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_SHA256: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Updater signing preflight failed: private-key secret is empty or unavailable.'
          }
          $keyText = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $keyBytes = [System.Text.Encoding]::UTF8.GetBytes($keyText)
            $actualFingerprint = [Convert]::ToHexString($sha.ComputeHash($keyBytes))
          } finally {
            $sha.Dispose()
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_SHA256) -or
              $actualFingerprint -ine $env:TAURI_SIGNING_PRIVATE_KEY_SHA256.Trim()) {
            throw 'Updater signing preflight failed: supplied private key does not match the approved fingerprint.'
          }
          Remove-Variable keyText,keyBytes,actualFingerprint -ErrorAction SilentlyContinue
          $probe = Join-Path $env:RUNNER_TEMP 'rdt-updater-signing-preflight.txt'
          $signature = "$probe.sig"
          try {
            Set-Content -LiteralPath $probe -Value 'RDT updater signing preflight' -NoNewline -Encoding ascii
            npm run tauri -- signer sign $probe
            if ($LASTEXITCODE -ne 0) { throw 'Tauri could not sign the preflight probe with the configured secrets.' }
            if (!(Test-Path -LiteralPath $signature) -or (Get-Item -LiteralPath $signature).Length -eq 0) {
              throw 'Signing preflight produced no non-empty signature.'
            }
            Write-Host 'Updater signing preflight: PASS'
          } finally {
            Remove-Item -LiteralPath $probe,$signature -Force -ErrorAction SilentlyContinue
          }

  package:
    needs: [signing-preflight, build-cuda-arm64-worker]
    permissions:
      contents: read
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Download verified ARM64 CUDA worker artifact
        uses: actions/download-artifact@v7.0.2
        with:
          name: rdt-windows-arm64-cuda-worker
          path: ${{ runner.temp }}/rdt-prebuilt-arm64-cuda

      - name: Validate downloaded ARM64 CUDA worker artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'rdt-prebuilt-arm64-cuda'
          $worker = Join-Path $artifactDir 'rdt_whisper_worker_cuda.exe'
          $manifest = Join-Path $artifactDir 'rdt_whisper_worker_cuda.manifest.json'
          if (-not (Test-Path -LiteralPath $worker -PathType Leaf)) {
            throw 'Downloaded ARM64 CUDA worker is missing.'
          }
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw 'Downloaded ARM64 CUDA worker manifest is missing.'
          }
          "RDT_PREBUILT_CUDA_WORKER=$worker" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RDT_PREBUILT_CUDA_WORKER_MANIFEST=$manifest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Prepare Windows ARM64 FFmpeg (pinned LGPL shared build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'rdt-ffmpeg-arm64'
          $downloader = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/download-pinned-ffmpeg.ps1'
          & $downloader -Architecture 'arm64' -Destination $destination
          if (-not (Test-Path -LiteralPath (Join-Path $destination 'ffmpeg.exe'))) {
            throw 'Verified FFmpeg executable was not staged.'
          }
          "RDT_FFMPEG_DIR=$destination" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up native Rust ARM64 target
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install pinned Windows ARM64 Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.363.0'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk-arm64.exe'
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK-$version"
          $download = "https://sdk.lunarg.com/sdk/download/$version/warm/vulkan_sdk.exe"
          $checksumUri = "https://sdk.lunarg.com/sdk/sha/$version/warm/vulkan_sdk.exe.json"

          $checksum = Invoke-RestMethod -Uri $checksumUri
          $expectedFile = "vulkansdk-windows-ARM64-$version.exe"
          if ($checksum.version -ne $version) {
            throw "LunarG checksum version mismatch: expected $version; got '$($checksum.version)'."
          }
          if ($checksum.platform -ne 'warm') {
            throw "LunarG checksum platform mismatch: expected warm; got '$($checksum.platform)'."
          }
          if ($checksum.file -ne $expectedFile) {
            throw "LunarG checksum filename mismatch: expected '$expectedFile'; got '$($checksum.file)'."
          }
          $expected = ([string]$checksum.sha).ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$') {
            throw "LunarG returned an invalid SHA-256 for Vulkan SDK $version."
          }

          Invoke-WebRequest -Uri $download -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Vulkan SDK SHA-256 mismatch. Expected $expected; got $actual."
          }
          Write-Host "VULKAN_SDK_VERSION=$version"
          Write-Host "VULKAN_SDK_SHA256=$actual"

          & $installer --root $sdkRoot --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK $version ARM64 installation failed with exit code $LASTEXITCODE."
          }

          $glslc = Join-Path $sdkRoot 'Bin/glslc.exe'
          if (-not (Test-Path -LiteralPath $glslc -PathType Leaf)) {
            throw "Vulkan SDK installed without expected shader compiler: $glslc"
          }

          $env:VULKAN_SDK = $sdkRoot
          "VULKAN_SDK=$sdkRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $glslc --version
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan shader compiler verification failed.' }

      - name: Set up pinned native Python 3.13.16 (ARM64)
        id: setup-python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13.16'
          architecture: 'arm64'

      - name: Verify shared lifetime statistics and packaging contract
        run: python backend/whisper_cpp/tests/test_lifetime_statistics.py

      - name: Install and verify native ARM64 CUDA runtime (no compiler or driver)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'cuda_13.5.0_windows_arm64.exe'
          $base = 'https://developer.download.nvidia.com/compute/cuda/13.5.0'
          $installer = Join-Path $env:RUNNER_TEMP $file
          $checksums = Join-Path $env:RUNNER_TEMP 'cuda-13.5-md5sum.txt'
          curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 10 --output $installer "$base/local_installers/$file"
          if ($LASTEXITCODE -ne 0) { throw "CUDA ARM64 runtime download failed: $LASTEXITCODE" }
          curl.exe --fail --location --retry 5 --retry-all-errors --output $checksums "$base/docs/sidebar/md5sum.txt"
          if ($LASTEXITCODE -ne 0) { throw "CUDA checksum download failed: $LASTEXITCODE" }
          $rows = @(Select-String -LiteralPath $checksums -SimpleMatch $file)
          if ($rows.Count -ne 1) { throw "Expected one official NVIDIA checksum entry for $file." }
          $checksumMatch = [regex]::Match($rows[0].Line, '(?i)\b[0-9a-f]{32}\b')
          if (-not $checksumMatch.Success) { throw "Could not parse NVIDIA MD5 entry for $file." }
          $expected = $checksumMatch.Value.ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm MD5).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "CUDA ARM64 installer checksum mismatch. Expected $expected; got $actual." }
          & $installer -s cudart_13.5 cublas_13.5
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "CUDA ARM64 runtime installation failed: $LASTEXITCODE" }
          $cudaRoot = Join-Path $env:ProgramFiles 'NVIDIA GPU Computing Toolkit\CUDA\v13.5'
          $cudaBin = Join-Path $cudaRoot 'bin'
          if (-not (Test-Path -LiteralPath $cudaBin -PathType Container)) { throw "CUDA runtime bin directory missing: $cudaBin" }
          function Get-PeMachine([string]$Path) {
            $stream = [IO.File]::OpenRead($Path)
            $reader = [IO.BinaryReader]::new($stream)
            try {
              if ($reader.ReadUInt16() -ne 0x5A4D) { throw "Invalid PE/DOS header: $Path" }
              $stream.Position = 0x3C
              $offset = $reader.ReadInt32()
              $stream.Position = $offset
              if ($reader.ReadUInt32() -ne 0x4550) { throw "Invalid PE signature: $Path" }
              return [int]$reader.ReadUInt16()
            } finally {
              $reader.Dispose()
              $stream.Dispose()
            }
          }
          foreach ($pattern in @('cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll')) {
            $dlls = @(Get-ChildItem -LiteralPath $cudaBin -Filter $pattern -File -Recurse)
            if ($dlls.Count -eq 0) { throw "Required ARM64 CUDA runtime DLL missing: $pattern" }
            foreach ($dll in $dlls) {
              if ((Get-PeMachine $dll.FullName) -ne 0xAA64) {
                throw "CUDA runtime DLL is not ARM64: $($dll.FullName)"
              }
            }
          }
          "CUDA_PATH=$cudaRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDAToolkit_ROOT=$cudaRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified native ARM64 CUDA runtime at $cudaRoot"

      - name: Prepare native Windows backend and web resources
        env:
          RDT_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($arch -ne 'Arm64') {
            throw "Expected native ARM64 runner; got $arch."
          }

          $python = $env:RDT_PYTHON
          if (-not $python -or -not (Test-Path $python)) {
            throw 'Pinned native ARM64 Python 3.13.16 executable not found.'
          }

          $info = (& $python -c 'import platform,sys; print("%d.%d.%d|%s" % (*sys.version_info[:3], platform.machine()))').Trim()
          Write-Host "Python verification: $info"
          if ($info -notmatch '^3\.13\.16\|(?i:ARM64|aarch64)$') {
            throw "Expected native ARM64 Python 3.13.16; got $info."
          }

          & .\rdt_connect\scripts\prepare-windows-bundle.ps1 `
            -TargetArch ARM64 `
            -Python $python `
            -FfmpegDir $env:RDT_FFMPEG_DIR `
            -EnableVulkan `
            -EnableCuda `
            -PrebuiltCudaWorker $env:RDT_PREBUILT_CUDA_WORKER `
            -PrebuiltCudaWorkerManifest $env:RDT_PREBUILT_CUDA_WORKER_MANIFEST `
            -RequireGpuWorker

      - name: Upload Windows ARM64 native worker diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-arm64-native-worker-diagnostics
          path: ${{ runner.temp }}/rdt-ARM64-worker-*.log
          if-no-files-found: warn
          retention-days: 3

      - name: Install frontend dependencies
        working-directory: rdt_connect
        shell: pwsh
        run: |
          npm ci 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/rdt-windows-arm64-npm-ci.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows frontend dependency installation failed.' }
      - name: Stamp isolated Windows build version (2A05 namespace)
        working-directory: rdt_connect
        shell: pwsh
        run: |
          node scripts/stamp-platform-build.cjs windows 2A05
          if ($LASTEXITCODE -ne 0) { throw 'Windows build marker/version stamping failed.' }
          node scripts/test-platform-build-stamping.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Platform build marker stamping tests failed.' }

      - name: Run W/L hardware benchmark and OOM regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s backend/whisper_cpp/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'W/L hardware benchmark and OOM regression tests failed.' }
      - name: Test build versioning
        working-directory: rdt_connect
        shell: pwsh
        run: npm run test:versioning

      - name: Generate and verify embedded RDT Voice R82 resources (Windows ARM64)
        shell: pwsh
        run: |
          python rdt_connect/scripts/generate-embedded-rdt-voice.py --repo-root $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Embedded RDT Voice resource generation failed.' }
      - name: Merge shared R82 notices into Windows arm64 package inventory
        run: python rdt_connect/scripts/merge-platform-third-party-notices.py --repo-root "$env:GITHUB_WORKSPACE" --platform windows

      - name: Build frontend
        working-directory: rdt_connect
        shell: pwsh
        env:
          VITE_RDT_LAZY_LOCALES: "true"
        run: |
          npm run build 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/rdt-windows-arm64-frontend-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows frontend build failed.' }

      - name: Verify localized model names in compiled frontend
        shell: pwsh
        run: python rdt_connect/scripts/test_model_localization_build.py

      - name: Build Windows ARM64 NSIS installer
        working-directory: rdt_connect
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm run tauri -- build --target aarch64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/rdt-windows-arm64-tauri-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows ARM64 installer build failed.' }

      - name: Verify installer and generate checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem $bundle -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue)

          if ($installers.Count -lt 1) {
            throw "No NSIS setup installer found in $bundle"
          }

          foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
            "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
            Write-Host "Installer: $($installer.Name)"
            Write-Host "SHA-256: $hash"
          }

      - name: Install and qualify Windows ARM64 package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $transcript = Join-Path $env:RUNNER_TEMP 'rdt-windows-arm64-installed-qualification.log'
          Start-Transcript -Path $transcript -Force
          try {
            & "$env:GITHUB_WORKSPACE/rdt_connect/scripts/qualify-windows-installed-package.ps1" `
              -TargetArch ARM64 `
              -ModelId "large-v3-turbo" `
              -InstallerDirectory "$env:GITHUB_WORKSPACE/rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis" `
              -EvidenceDirectory "$env:RUNNER_TEMP/rdt-windows-arm64-installed"
          } finally {
            Stop-Transcript | Out-Null
          }
      - name: Upload Windows ARM64 installed benchmark and inference evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          retention-days: 30
          name: rdt-windows-arm64-installed-qualification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rdt-windows-arm64-installed/
          if-no-files-found: warn

      - name: Verify signed Windows updater artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*-setup.exe' -File)
          if ($installers.Count -lt 1) {
            throw "No NSIS setup installer found in $bundle"
          }
          foreach ($installer in $installers) {
            $signature = "$($installer.FullName).sig"
            if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) {
              throw "Updater signature missing: $signature"
            }
            foreach ($file in @($installer.FullName, $signature)) {
              $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256" -Encoding ascii
              Write-Host "Verified updater artifact: $(Split-Path $file -Leaf)"
            }
          }

      - name: Package Windows pre-install guide
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $guide = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/windows-package/guide'
          $stage = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-Installation-Guide'
          $zip = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-Installation-Guide.zip'
          $required = @(
            'windows_installation_guide.html',
            'rdt_connect_guide_icon.png',
            'rdt_connect_guide.ico'
          )

          foreach ($name in $required) {
            $file = Join-Path $guide $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required installation guide asset is missing: $file"
            }
          }

          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage | Out-Null
          foreach ($name in $required) {
            Copy-Item -LiteralPath (Join-Path $guide $name) -Destination $stage
          }

          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "Guide ZIP: $zip"
          Write-Host "SHA-256: $hash"

      - name: Package combined Windows ARM64 distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis'
          $guide = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/windows-package/guide'
          $stage = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-ARM64-DISTRIBUTION'
          $zip = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-ARM64-DISTRIBUTION.zip'

          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows setup installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          $installerHash = "$($installer.FullName).sha256"
          if (-not (Test-Path -LiteralPath $installerHash -PathType Leaf)) {
            throw "Installer checksum is missing: $installerHash"
          }

          $required = @(
            'windows_installation_guide.html',
            'rdt_connect_guide_icon.png',
            'rdt_connect_guide.ico'
          )
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $guide $name) -PathType Leaf)) {
              throw "Required guide asset is missing: $name"
            }
          }

          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination $stage
          Copy-Item -LiteralPath $installerHash -Destination $stage

          $updaterInstallers = @(Get-ChildItem -LiteralPath $bundle -Filter '*-setup.exe' -File)
          if ($updaterInstallers.Count -lt 1) {
            throw "No NSIS installer available to package from $bundle"
          }
          foreach ($installer in $updaterInstallers) {
            $signature = "$($installer.FullName).sig"
            foreach ($file in @($installer.FullName, $signature, "$($installer.FullName).sha256", "$signature.sha256")) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                throw "Required signed updater distribution file is missing: $file"
              }
              Copy-Item -LiteralPath $file -Destination $stage
            }
          }

          foreach ($name in $required) {
            Copy-Item -LiteralPath (Join-Path $guide $name) -Destination $stage
          }

          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "Distribution ZIP: $zip"
          Write-Host "SHA-256: $zipHash"

      - name: Create Windows ARM64 release identity manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestDir = Join-Path $env:RUNNER_TEMP 'rdt-release-manifest'
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis'
          $zip = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-ARM64-DISTRIBUTION.zip'
          $guide = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-Installation-Guide.zip'
          $evidence = Join-Path $env:RUNNER_TEMP 'rdt-windows-arm64-installed'
          if (-not (Test-Path -LiteralPath $evidence -PathType Container)) { throw 'Installed qualification evidence folder is missing.' }
          $assets = @($zip, ($zip + '.sha256'), $guide, ($guide + '.sha256'))
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one signed NSIS installer.' }
          foreach ($item in $installers) { $assets += @($item.FullName, ($item.FullName + '.sha256'), ($item.FullName + '.sig'), ($item.FullName + '.sig.sha256')) }
          $arguments = @(
            'rdt_connect/scripts/release_artifact_manifest.py',
            '--platform', 'windows', '--architecture', 'ARM64', '--marker', '2A05',
            '--tauri-config', 'rdt_connect/src-tauri/tauri.conf.json',
            '--repository', $env:GITHUB_REPOSITORY, '--source-sha', $env:GITHUB_SHA,
            '--source-ref', $env:GITHUB_REF, '--run-id', $env:GITHUB_RUN_ID,
            '--run-attempt', $env:GITHUB_RUN_ATTEMPT, '--workflow-name', $env:GITHUB_WORKFLOW,
            '--output', (Join-Path $manifestDir 'release-manifest.json'),
            '--artifact-name', ('RDT-Connect-Windows-ARM64-DISTRIBUTION-${{ github.run_attempt }}'),
            '--artifact-name', ('RDT-Connect-Windows-ARM64-INSTALLATION-GUIDE-${{ github.run_attempt }}'),
            '--artifact-name', ('RDT-Connect-Windows-ARM64-TEST-INSTALLER-${{ github.run_attempt }}'),
            '--artifact-name', ('rdt-connect-windows-arm64-release-manifest-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT),
            '--qualification-artifact-name', ('rdt-windows-arm64-installed-qualification-' + $env:GITHUB_RUN_ATTEMPT),
            '--evidence', $evidence
          )
          foreach ($asset in $assets) { $arguments += @('--asset', $asset) }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows release manifest generation failed.' }
      - name: Upload combined Windows ARM64 distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RDT-Connect-Windows-ARM64-DISTRIBUTION-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/RDT-Connect-Windows-ARM64-DISTRIBUTION.zip
            ${{ runner.temp }}/RDT-Connect-Windows-ARM64-DISTRIBUTION.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows pre-install guide artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RDT-Connect-Windows-ARM64-INSTALLATION-GUIDE-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/RDT-Connect-Windows-Installation-Guide.zip
            ${{ runner.temp }}/RDT-Connect-Windows-Installation-Guide.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test installer artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RDT-Connect-Windows-ARM64-TEST-INSTALLER-${{ github.run_attempt }}
          path: |
            rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sha256
            rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
            rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows ARM64 release identity manifest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rdt-connect-windows-arm64-release-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rdt-release-manifest/release-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows ARM64 failure diagnostics and partial packages
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-arm64-failure-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rdt-ARM64-worker-*.log
            ${{ runner.temp }}/rdt-windows-arm64-*.log
            ${{ runner.temp }}/rdt-windows-arm64-installed/**
            rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe*
            ${{ runner.temp }}/RDT-Connect-Windows-ARM64-DISTRIBUTION.zip*
            ${{ runner.temp }}/RDT-Connect-Windows-Installation-Guide.zip*
          if-no-files-found: warn
          retention-days: 7
