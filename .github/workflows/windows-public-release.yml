name: RDT Connect Windows Public Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish both architecture-specific releases after successful builds"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  arm64-updater-contract:
    name: Fast Windows updater artifact contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Validate Tauri updater artifact contract
        shell: bash
        run: |
          python3 - <<'PYCONTRACT'
          import json
          from pathlib import Path

          config = json.loads(Path("rdt_connect/src-tauri/tauri.windows.conf.json").read_text())
          workflow = Path(".github/workflows/windows-arm64-installer.yml").read_text()
          assert config.get("bundle", {}).get("createUpdaterArtifacts") is True, "Tauri updater artifacts must be enabled"
          assert "*-setup.exe" in workflow, "Workflow must verify the actual NSIS setup executable"
          assert '"$($installer.FullName).sig"' in workflow, "Workflow must verify the matching installer signature"
          assert "$signature.sha256" in workflow, "Distribution must include the signature checksum"
          print("PASS: Tauri v2 NSIS updater artifact contract")
          PYCONTRACT

  arm64-signing-preflight:
    needs: arm64-updater-contract
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install dependencies for signing probe
        working-directory: rdt_connect
        shell: pwsh
        run: npm ci
      - name: Preflight updater signing secrets
        working-directory: rdt_connect
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_SHA256: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Updater signing preflight failed: private-key secret is empty or unavailable.'
          }
          $keyText = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $keyBytes = [System.Text.Encoding]::UTF8.GetBytes($keyText)
            $actualFingerprint = [Convert]::ToHexString($sha.ComputeHash($keyBytes))
          } finally {
            $sha.Dispose()
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_SHA256) -or
              $actualFingerprint -ine $env:TAURI_SIGNING_PRIVATE_KEY_SHA256.Trim()) {
            throw 'Updater signing preflight failed: supplied private key does not match the approved fingerprint.'
          }
          Remove-Variable keyText,keyBytes,actualFingerprint -ErrorAction SilentlyContinue
          $probe = Join-Path $env:RUNNER_TEMP 'rdt-updater-signing-preflight.txt'
          $signature = "$probe.sig"
          try {
            Set-Content -LiteralPath $probe -Value 'RDT updater signing preflight' -NoNewline -Encoding ascii
            npm run tauri -- signer sign $probe
            if ($LASTEXITCODE -ne 0) { throw 'Tauri could not sign the preflight probe with the configured secrets.' }
            if (!(Test-Path -LiteralPath $signature) -or (Get-Item -LiteralPath $signature).Length -eq 0) {
              throw 'Signing preflight produced no non-empty signature.'
            }
            Write-Host 'Updater signing preflight: PASS'
          } finally {
            Remove-Item -LiteralPath $probe,$signature -Force -ErrorAction SilentlyContinue
          }

  arm64-package:
    needs: arm64-signing-preflight
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Prepare Windows ARM64 FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64-lgpl.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64-extracted'
          $destination = Join-Path $env:RUNNER_TEMP 'rdt-ffmpeg-arm64'
          # Pin an immutable release asset and verify its SHA-256 before extraction.
          # Source: BtbN/FFmpeg-Builds release autobuild-2026-10-19-13-06,
          # checksums.sha256; never consume the mutable /download/latest/ alias.
          $uri = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-19-13-06/ffmpeg-N-127696-g8b3525e718-winarm64-lgpl.zip'
          $expectedSha256 = 'd4fd29fa9128fc1ba623e23b2ea1f13f283c646eb108c8583854371b2ba3d9d4'

          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            throw "Pinned FFmpeg archive SHA-256 mismatch: expected $expectedSha256; actual $actualSha256."
          }
          Write-Host "FFMPEG_ARCHIVE_SHA256_VERIFIED=$actualSha256"

          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem $extract -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $extract -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
          $license = Get-ChildItem $extract -File -Recurse |
            Where-Object { $_.Name -in @('LICENSE.txt', 'LICENSE') } |
            Select-Object -First 1

          if (-not $ffmpeg -or -not $ffprobe -or -not $license) {
            throw 'FFmpeg executables or license notice missing from downloaded archive.'
          }

          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item $ffmpeg.FullName (Join-Path $destination 'ffmpeg.exe')
          Copy-Item $ffprobe.FullName (Join-Path $destination 'ffprobe.exe')
          Copy-Item $license.FullName (Join-Path $destination 'LICENSE.txt')

          $ffmpegVersion = & (Join-Path $destination 'ffmpeg.exe') -version
          if ($LASTEXITCODE -ne 0) {
            throw "Prepared ARM64 ffmpeg.exe failed its version check with exit code $LASTEXITCODE."
          }
          $ffmpegVersion | Select-Object -First 1

          $ffprobeVersion = & (Join-Path $destination 'ffprobe.exe') -version
          if ($LASTEXITCODE -ne 0) {
            throw "Prepared ARM64 ffprobe.exe failed its version check with exit code $LASTEXITCODE."
          }
          $ffprobeVersion | Select-Object -First 1
          "RDT_FFMPEG_DIR=$destination" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up native Rust ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install pinned Windows ARM64 Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.363.0'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk-arm64.exe'
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK-$version"
          $download = "https://sdk.lunarg.com/sdk/download/$version/warm/vulkan_sdk.exe"
          $checksumUri = "https://sdk.lunarg.com/sdk/sha/$version/warm/vulkan_sdk.exe.json"

          $checksum = Invoke-RestMethod -Uri $checksumUri
          $expectedFile = "vulkansdk-windows-ARM64-$version.exe"
          if ($checksum.version -ne $version) {
            throw "LunarG checksum version mismatch: expected $version; got '$($checksum.version)'."
          }
          if ($checksum.platform -ne 'warm') {
            throw "LunarG checksum platform mismatch: expected warm; got '$($checksum.platform)'."
          }
          if ($checksum.file -ne $expectedFile) {
            throw "LunarG checksum filename mismatch: expected '$expectedFile'; got '$($checksum.file)'."
          }
          $expected = ([string]$checksum.sha).ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$') {
            throw "LunarG returned an invalid SHA-256 for Vulkan SDK $version."
          }

          Invoke-WebRequest -Uri $download -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Vulkan SDK SHA-256 mismatch. Expected $expected; got $actual."
          }
          Write-Host "VULKAN_SDK_VERSION=$version"
          Write-Host "VULKAN_SDK_SHA256=$actual"

          & $installer --root $sdkRoot --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK $version ARM64 installation failed with exit code $LASTEXITCODE."
          }

          $glslc = Join-Path $sdkRoot 'Bin/glslc.exe'
          if (-not (Test-Path -LiteralPath $glslc -PathType Leaf)) {
            throw "Vulkan SDK installed without expected shader compiler: $glslc"
          }

          $env:VULKAN_SDK = $sdkRoot
          "VULKAN_SDK=$sdkRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $glslc --version
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan shader compiler verification failed.' }

      - name: Set up pinned native Python 3.13.16 (ARM64)
        id: setup-python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13.16'
          architecture: 'arm64'

      - name: Prepare native Windows backend and web resources
        env:
          RDT_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($arch -ne 'Arm64') {
            throw "Expected native ARM64 runner; got $arch."
          }

          $python = $env:RDT_PYTHON
          if (-not $python -or -not (Test-Path $python)) {
            throw 'Pinned native ARM64 Python 3.13.16 executable not found.'
          }

          $info = (& $python -c 'import platform,sys; print("%d.%d.%d|%s" % (*sys.version_info[:3], platform.machine()))').Trim()
          Write-Host "Python verification: $info"
          if ($info -notmatch '^3\.13\.16\|(?i:ARM64|aarch64)$') {
            throw "Expected native ARM64 Python 3.13.16; got $info."
          }

          & .\rdt_connect\scripts\prepare-windows-bundle.ps1 `
            -TargetArch ARM64 `
            -Python $python `
            -FfmpegDir $env:RDT_FFMPEG_DIR `
            -EnableVulkan `
            -RequireGpuWorker

      - name: Upload Windows ARM64 native worker diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-arm64-native-worker-diagnostics
          path: ${{ runner.temp }}/rdt-ARM64-worker-*.log
          if-no-files-found: warn
          retention-days: 3

      - name: Install frontend dependencies
        working-directory: rdt_connect
        shell: pwsh
        run: npm ci
      - name: Stamp isolated Windows build version (2A07 namespace)
        working-directory: rdt_connect
        shell: pwsh
        run: |
          node scripts/stamp-platform-build.cjs windows 2A07
          if ($LASTEXITCODE -ne 0) { throw 'Windows build marker/version stamping failed.' }
          node scripts/test-platform-build-stamping.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Platform build marker stamping tests failed.' }

      - name: Test build versioning
        working-directory: rdt_connect
        shell: pwsh
        run: npm run test:versioning

      - name: Build frontend
        working-directory: rdt_connect
        shell: pwsh
        run: npm run build

      - name: Build Windows ARM64 NSIS installer
        working-directory: rdt_connect
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm run tauri -- build --target aarch64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows ARM64 installer build failed.' }

      - name: Verify installer and generate checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem $bundle -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue)

          if ($installers.Count -lt 1) {
            throw "No NSIS setup installer found in $bundle"
          }

          foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
            "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
            Write-Host "Installer: $($installer.Name)"
            Write-Host "SHA-256: $hash"
          }

      - name: Verify signed Windows updater artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*-setup.exe' -File)
          if ($installers.Count -lt 1) {
            throw "No NSIS setup installer found in $bundle"
          }
          foreach ($installer in $installers) {
            $signature = "$($installer.FullName).sig"
            if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) {
              throw "Updater signature missing: $signature"
            }
            foreach ($file in @($installer.FullName, $signature)) {
              $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256" -Encoding ascii
              Write-Host "Verified updater artifact: $(Split-Path $file -Leaf)"
            }
          }

      - name: Package Windows pre-install guide
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $guide = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/windows-package/guide'
          $stage = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-Installation-Guide'
          $zip = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-Installation-Guide.zip'
          $required = @(
            'windows_installation_guide.html',
            'rdt_connect_guide_icon.png',
            'rdt_connect_guide.ico'
          )

          foreach ($name in $required) {
            $file = Join-Path $guide $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required installation guide asset is missing: $file"
            }
          }

          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage | Out-Null
          foreach ($name in $required) {
            Copy-Item -LiteralPath (Join-Path $guide $name) -Destination $stage
          }

          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "Guide ZIP: $zip"
          Write-Host "SHA-256: $hash"

      - name: Package combined Windows ARM64 distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis'
          $guide = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/windows-package/guide'
          $stage = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-ARM64-DISTRIBUTION'
          $zip = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-ARM64-DISTRIBUTION.zip'

          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows setup installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          $installerHash = "$($installer.FullName).sha256"
          if (-not (Test-Path -LiteralPath $installerHash -PathType Leaf)) {
            throw "Installer checksum is missing: $installerHash"
          }

          $required = @(
            'windows_installation_guide.html',
            'rdt_connect_guide_icon.png',
            'rdt_connect_guide.ico'
          )
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $guide $name) -PathType Leaf)) {
              throw "Required guide asset is missing: $name"
            }
          }

          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination $stage
          Copy-Item -LiteralPath $installerHash -Destination $stage

          $updaterInstallers = @(Get-ChildItem -LiteralPath $bundle -Filter '*-setup.exe' -File)
          if ($updaterInstallers.Count -lt 1) {
            throw "No NSIS installer available to package from $bundle"
          }
          foreach ($installer in $updaterInstallers) {
            $signature = "$($installer.FullName).sig"
            foreach ($file in @($installer.FullName, $signature, "$($installer.FullName).sha256", "$signature.sha256")) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                throw "Required signed updater distribution file is missing: $file"
              }
              Copy-Item -LiteralPath $file -Destination $stage
            }
          }

          foreach ($name in $required) {
            Copy-Item -LiteralPath (Join-Path $guide $name) -Destination $stage
          }

          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "Distribution ZIP: $zip"
          Write-Host "SHA-256: $zipHash"

      - name: Upload combined Windows ARM64 distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RDT-Connect-Windows-ARM64-DISTRIBUTION
          path: |
            ${{ runner.temp }}/RDT-Connect-Windows-ARM64-DISTRIBUTION.zip
            ${{ runner.temp }}/RDT-Connect-Windows-ARM64-DISTRIBUTION.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows pre-install guide artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RDT-Connect-Windows-ARM64-INSTALLATION-GUIDE
          path: |
            ${{ runner.temp }}/RDT-Connect-Windows-Installation-Guide.zip
            ${{ runner.temp }}/RDT-Connect-Windows-Installation-Guide.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test installer artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RDT-Connect-Windows-ARM64-PUBLIC-RELEASE-INSTALLER
          path: |
            rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sha256
            rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
            rdt_connect/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig.sha256
          if-no-files-found: error
          retention-days: 14

  x64-updater-contract:
    name: Fast Windows updater artifact contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Validate Tauri updater artifact contract
        shell: bash
        run: |
          python3 - <<'PYCONTRACT'
          import json
          from pathlib import Path

          config = json.loads(Path("rdt_connect/src-tauri/tauri.windows.conf.json").read_text())
          workflow = Path(".github/workflows/windows-x64-installer.yml").read_text()
          assert config.get("bundle", {}).get("createUpdaterArtifacts") is True, "Tauri updater artifacts must be enabled"
          assert "*-setup.exe" in workflow, "Workflow must verify the actual NSIS setup executable"
          assert '"$($installer.FullName).sig"' in workflow, "Workflow must verify the matching installer signature"
          assert "$signature.sha256" in workflow, "Distribution must include the signature checksum"
          print("PASS: Tauri v2 NSIS updater artifact contract")
          PYCONTRACT

  x64-signing-preflight:
    needs: x64-updater-contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install dependencies for signing probe
        working-directory: rdt_connect
        shell: pwsh
        run: npm ci
      - name: Preflight updater signing secrets
        working-directory: rdt_connect
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_SHA256: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Updater signing preflight failed: private-key secret is empty or unavailable.'
          }
          $keyText = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $keyBytes = [System.Text.Encoding]::UTF8.GetBytes($keyText)
            $actualFingerprint = [Convert]::ToHexString($sha.ComputeHash($keyBytes))
          } finally {
            $sha.Dispose()
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_SHA256) -or
              $actualFingerprint -ine $env:TAURI_SIGNING_PRIVATE_KEY_SHA256.Trim()) {
            throw 'Updater signing preflight failed: supplied private key does not match the approved fingerprint.'
          }
          Remove-Variable keyText,keyBytes,actualFingerprint -ErrorAction SilentlyContinue
          $probe = Join-Path $env:RUNNER_TEMP 'rdt-updater-signing-preflight.txt'
          $signature = "$probe.sig"
          try {
            Set-Content -LiteralPath $probe -Value 'RDT updater signing preflight' -NoNewline -Encoding ascii
            npm run tauri -- signer sign $probe
            if ($LASTEXITCODE -ne 0) { throw 'Tauri could not sign the preflight probe with the configured secrets.' }
            if (!(Test-Path -LiteralPath $signature) -or (Get-Item -LiteralPath $signature).Length -eq 0) {
              throw 'Signing preflight produced no non-empty signature.'
            }
            Write-Host 'Updater signing preflight: PASS'
          } finally {
            Remove-Item -LiteralPath $probe,$signature -Force -ErrorAction SilentlyContinue
          }

  x64-package:
    needs: x64-signing-preflight
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Prepare Windows x64 FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-x64-lgpl.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-x64-extracted'
          $destination = Join-Path $env:RUNNER_TEMP 'rdt-ffmpeg-x64'
          # Pin an immutable release asset and verify its SHA-256 before extraction.
          # Source: BtbN/FFmpeg-Builds release autobuild-2026-10-19-13-06,
          # checksums.sha256; never consume the mutable /download/latest/ alias.
          $uri = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-19-13-06/ffmpeg-N-127696-g8b3525e718-win64-lgpl.zip'
          $expectedSha256 = 'f6cfd42be37761089215ec4015146d7f0f679183fa966ac1a8cdf95b62e446dd'

          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            throw "Pinned FFmpeg archive SHA-256 mismatch: expected $expectedSha256; actual $actualSha256."
          }
          Write-Host "FFMPEG_ARCHIVE_SHA256_VERIFIED=$actualSha256"

          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem $extract -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $extract -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
          $license = Get-ChildItem $extract -File -Recurse |
            Where-Object { $_.Name -in @('LICENSE.txt', 'LICENSE') } |
            Select-Object -First 1

          if (-not $ffmpeg -or -not $ffprobe -or -not $license) {
            throw 'FFmpeg executables or license notice missing from downloaded archive.'
          }

          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item $ffmpeg.FullName (Join-Path $destination 'ffmpeg.exe')
          Copy-Item $ffprobe.FullName (Join-Path $destination 'ffprobe.exe')
          Copy-Item $license.FullName (Join-Path $destination 'LICENSE.txt')

          $ffmpegVersion = & (Join-Path $destination 'ffmpeg.exe') -version
          if ($LASTEXITCODE -ne 0) {
            throw "Prepared x64 ffmpeg.exe failed its version check with exit code $LASTEXITCODE."
          }
          $ffmpegVersion | Select-Object -First 1

          $ffprobeVersion = & (Join-Path $destination 'ffprobe.exe') -version
          if ($LASTEXITCODE -ne 0) {
            throw "Prepared x64 ffprobe.exe failed its version check with exit code $LASTEXITCODE."
          }
          $ffprobeVersion | Select-Object -First 1
          "RDT_FFMPEG_DIR=$destination" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up native Rust x64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install pinned Windows x64 Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.363.0'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk-x64.exe'
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK-$version"
          $download = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe"
          $checksumUri = "https://sdk.lunarg.com/sdk/sha/$version/windows/vulkan_sdk.exe.json"

          $checksum = Invoke-RestMethod -Uri $checksumUri
          $expectedFile = "vulkansdk-windows-X64-$version.exe"
          if ($checksum.version -ne $version) {
            throw "LunarG checksum version mismatch: expected $version; got '$($checksum.version)'."
          }
          if ($checksum.platform -ne 'windows') {
            throw "LunarG checksum platform mismatch: expected windows; got '$($checksum.platform)'."
          }
          if ($checksum.file -ne $expectedFile) {
            throw "LunarG checksum filename mismatch: expected '$expectedFile'; got '$($checksum.file)'."
          }
          $expected = ([string]$checksum.sha).ToLowerInvariant()
          $pinnedSha256 = '94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141'
          if ($expected -ne $pinnedSha256) {
            throw "LunarG Vulkan SDK checksum differs from the approved x64 pin. Expected $pinnedSha256; got $expected."
          }
          if ($expected -notmatch '^[0-9a-f]{64}$') {
            throw "LunarG returned an invalid SHA-256 for Vulkan SDK $version."
          }

          Invoke-WebRequest -Uri $download -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Vulkan SDK SHA-256 mismatch. Expected $expected; got $actual."
          }
          Write-Host "VULKAN_SDK_VERSION=$version"
          Write-Host "VULKAN_SDK_SHA256=$actual"

          & $installer --root $sdkRoot --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK $version x64 installation failed with exit code $LASTEXITCODE."
          }

          $glslc = Join-Path $sdkRoot 'Bin/glslc.exe'
          if (-not (Test-Path -LiteralPath $glslc -PathType Leaf)) {
            throw "Vulkan SDK installed without expected shader compiler: $glslc"
          }

          $env:VULKAN_SDK = $sdkRoot
          "VULKAN_SDK=$sdkRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $glslc --version
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan shader compiler verification failed.' }

      - name: Set up pinned native Python 3.13.16 (x64)
        id: setup-python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13.16'
          architecture: 'x64'

      - name: Prepare native Windows backend and web resources
        env:
          RDT_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($arch -ne 'X64') {
            throw "Expected native x64 runner; got $arch."
          }

          $python = $env:RDT_PYTHON
          if (-not $python -or -not (Test-Path $python)) {
            throw 'Pinned native x64 Python 3.13.16 executable not found.'
          }

          $info = (& $python -c 'import platform,sys; print("%d.%d.%d|%s" % (*sys.version_info[:3], platform.machine()))').Trim()
          Write-Host "Python verification: $info"
          if ($info -notmatch '^3\.13\.16\|(?i:amd64|x86_64|x64)$') {
            throw "Expected native x64 Python 3.13.16 (AMD64/x86_64); got $info."
          }

          & .\rdt_connect\scripts\prepare-windows-bundle.ps1 `
            -TargetArch x64 `
            -Python $python `
            -FfmpegDir $env:RDT_FFMPEG_DIR `
            -EnableVulkan `
            -RequireGpuWorker

      - name: Upload Windows x64 native worker diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-x64-native-worker-diagnostics
          path: ${{ runner.temp }}/rdt-x64-worker-*.log
          if-no-files-found: warn
          retention-days: 3

      - name: Install frontend dependencies
        working-directory: rdt_connect
        shell: pwsh
        run: npm ci
      - name: Stamp isolated Windows build version (3A03 namespace)
        working-directory: rdt_connect
        shell: pwsh
        run: |
          node scripts/stamp-platform-build.cjs windows 3A03
          if ($LASTEXITCODE -ne 0) { throw 'Windows build marker/version stamping failed.' }
          node scripts/test-platform-build-stamping.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Platform build marker stamping tests failed.' }

      - name: Test build versioning
        working-directory: rdt_connect
        shell: pwsh
        run: npm run test:versioning

      - name: Build frontend
        working-directory: rdt_connect
        shell: pwsh
        run: npm run build

      - name: Build Windows x64 NSIS installer
        working-directory: rdt_connect
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm run tauri -- build --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows x64 installer build failed.' }

      - name: Verify installer and generate checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem $bundle -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue)

          if ($installers.Count -lt 1) {
            throw "No NSIS setup installer found in $bundle"
          }

          foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
            "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
            Write-Host "Installer: $($installer.Name)"
            Write-Host "SHA-256: $hash"
          }

      - name: Verify signed Windows updater artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*-setup.exe' -File)
          if ($installers.Count -lt 1) {
            throw "No NSIS setup installer found in $bundle"
          }
          foreach ($installer in $installers) {
            $signature = "$($installer.FullName).sig"
            if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) {
              throw "Updater signature missing: $signature"
            }
            foreach ($file in @($installer.FullName, $signature)) {
              $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256" -Encoding ascii
              Write-Host "Verified updater artifact: $(Split-Path $file -Leaf)"
            }
          }

      - name: Package Windows pre-install guide
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $guide = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/windows-package/guide'
          $stage = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-Installation-Guide'
          $zip = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-Installation-Guide.zip'
          $required = @(
            'windows_installation_guide.html',
            'rdt_connect_guide_icon.png',
            'rdt_connect_guide.ico'
          )

          foreach ($name in $required) {
            $file = Join-Path $guide $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required installation guide asset is missing: $file"
            }
          }

          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage | Out-Null
          foreach ($name in $required) {
            Copy-Item -LiteralPath (Join-Path $guide $name) -Destination $stage
          }

          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "Guide ZIP: $zip"
          Write-Host "SHA-256: $hash"

      - name: Package combined Windows x64 distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $guide = Join-Path $env:GITHUB_WORKSPACE 'rdt_connect/windows-package/guide'
          $stage = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-x64-DISTRIBUTION'
          $zip = Join-Path $env:RUNNER_TEMP 'RDT-Connect-Windows-x64-DISTRIBUTION.zip'

          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows setup installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          $installerHash = "$($installer.FullName).sha256"
          if (-not (Test-Path -LiteralPath $installerHash -PathType Leaf)) {
            throw "Installer checksum is missing: $installerHash"
          }

          $required = @(
            'windows_installation_guide.html',
            'rdt_connect_guide_icon.png',
            'rdt_connect_guide.ico'
          )
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $guide $name) -PathType Leaf)) {
              throw "Required guide asset is missing: $name"
            }
          }

          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination $stage
          Copy-Item -LiteralPath $installerHash -Destination $stage

          $updaterInstallers = @(Get-ChildItem -LiteralPath $bundle -Filter '*-setup.exe' -File)
          if ($updaterInstallers.Count -lt 1) {
            throw "No NSIS installer available to package from $bundle"
          }
          foreach ($installer in $updaterInstallers) {
            $signature = "$($installer.FullName).sig"
            foreach ($file in @($installer.FullName, $signature, "$($installer.FullName).sha256", "$signature.sha256")) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                throw "Required signed updater distribution file is missing: $file"
              }
              Copy-Item -LiteralPath $file -Destination $stage
            }
          }

          foreach ($name in $required) {
            Copy-Item -LiteralPath (Join-Path $guide $name) -Destination $stage
          }

          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "Distribution ZIP: $zip"
          Write-Host "SHA-256: $zipHash"

      - name: Upload combined Windows x64 distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RDT-Connect-Windows-x64-DISTRIBUTION
          path: |
            ${{ runner.temp }}/RDT-Connect-Windows-x64-DISTRIBUTION.zip
            ${{ runner.temp }}/RDT-Connect-Windows-x64-DISTRIBUTION.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows pre-install guide artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RDT-Connect-Windows-x64-INSTALLATION-GUIDE
          path: |
            ${{ runner.temp }}/RDT-Connect-Windows-Installation-Guide.zip
            ${{ runner.temp }}/RDT-Connect-Windows-Installation-Guide.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test installer artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RDT-Connect-Windows-x64-PUBLIC-RELEASE-INSTALLER
          path: |
            rdt_connect/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            rdt_connect/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sha256
            rdt_connect/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
            rdt_connect/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Prepare and optionally publish both Windows releases
    needs: [arm64-package, x64-package]
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7.0.1

      - name: Download ARM64 distribution
        uses: actions/download-artifact@v8.0.2
        with:
          name: RDT-Connect-Windows-ARM64-DISTRIBUTION
          path: ${{ runner.temp }}/release-assets/arm64-distribution

      - name: Download x64 distribution
        uses: actions/download-artifact@v8.0.2
        with:
          name: RDT-Connect-Windows-x64-DISTRIBUTION
          path: ${{ runner.temp }}/release-assets/x64-distribution

      - name: Download Windows installation guide package
        uses: actions/download-artifact@v8.0.2
        with:
          name: RDT-Connect-Windows-ARM64-INSTALLATION-GUIDE
          path: ${{ runner.temp }}/release-assets/guide

      - name: Download ARM64 signed installer files
        uses: actions/download-artifact@v8.0.2
        with:
          name: RDT-Connect-Windows-ARM64-PUBLIC-RELEASE-INSTALLER
          path: ${{ runner.temp }}/release-assets/arm64-installer

      - name: Download x64 signed installer files
        uses: actions/download-artifact@v8.0.2
        with:
          name: RDT-Connect-Windows-x64-PUBLIC-RELEASE-INSTALLER
          path: ${{ runner.temp }}/release-assets/x64-installer

      - name: Prepare standalone installation guide
        shell: bash
        run: |
          set -euo pipefail
          cp rdt_connect/windows-package/guide/windows_installation_guide.html \
            "$RUNNER_TEMP/release-assets/windows-installation-guide.html"

      - name: Validate all release assets and unused tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "release-assets"
          for arch, stem in [
              ("arm64", "RDT-Connect-Windows-ARM64-DISTRIBUTION"),
              ("x64", "RDT-Connect-Windows-x64-DISTRIBUTION"),
          ]:
              dist = root / f"{arch}-distribution"
              zips = list(dist.glob("*.zip"))
              if len(zips) != 1 or zips[0].name != f"{stem}.zip":
                  raise SystemExit(f"FAIL: unexpected {arch} distribution ZIPs: {zips}")
              if not (dist / f"{stem}.zip.sha256").is_file():
                  raise SystemExit(f"FAIL: missing {arch} distribution checksum")

              installer_dir = root / f"{arch}-installer"
              installers = list(installer_dir.glob("*-setup.exe"))
              if len(installers) != 1:
                  raise SystemExit(f"FAIL: expected one {arch} installer; found {len(installers)}")
              installer = installers[0]
              for required in [
                  installer,
                  Path(str(installer) + ".sha256"),
                  Path(str(installer) + ".sig"),
                  Path(str(installer) + ".sig.sha256"),
              ]:
                  if not required.is_file() or required.stat().st_size == 0:
                      raise SystemExit(f"FAIL: missing or empty signed installer asset: {required}")

          guide = root / "guide"
          for name in [
              "RDT-Connect-Windows-Installation-Guide.zip",
              "RDT-Connect-Windows-Installation-Guide.zip.sha256",
          ]:
              if not (guide / name).is_file():
                  raise SystemExit(f"FAIL: missing guide asset: {name}")

          html = root / "windows-installation-guide.html"
          if not html.is_file() or html.stat().st_size == 0:
              raise SystemExit("FAIL: standalone installation guide is missing")
          print("PASS: both installers, signatures, checksums, distributions, and guide are present")
          PY

          for tag in \
            connect-v0.2.0-dev.11-2a07 \
            connect-v0.2.0-dev.11-3a03
          do
            if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "STOP: release tag already exists: $tag"
              exit 1
            fi
          done

      - name: Create ARM64 draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-assets"
          tag="connect-v0.2.0-dev.11-2a07"
          gh release create "$tag" \
            "$root/arm64-installer/"* \
            "$root/arm64-distribution/"* \
            "$root/guide/"* \
            "$root/windows-installation-guide.html" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RDT Connect Dev 11 — Windows ARM64 Build 2A07" \
            --notes "Windows ARM64 public release, Build 2A07.

          Includes the signed NSIS installer, updater signature and checksums, combined distribution package, and Windows installation guide." \
            --prerelease --draft

      - name: Create x64 draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-assets"
          tag="connect-v0.2.0-dev.11-3a03"
          gh release create "$tag" \
            "$root/x64-installer/"* \
            "$root/x64-distribution/"* \
            "$root/guide/"* \
            "$root/windows-installation-guide.html" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RDT Connect Dev 11 — Windows x64 Build 3A03" \
            --notes "Windows x64 public release, Build 3A03.

          Includes the signed NSIS installer, updater signature and checksums, combined distribution package, and Windows installation guide." \
            --prerelease --draft

      - name: Publish both prepared releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          arm_id="$(gh release view connect-v0.2.0-dev.11-2a07 \
            --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          x64_id="$(gh release view connect-v0.2.0-dev.11-3a03 \
            --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"

          test -n "$arm_id"
          test -n "$x64_id"

          # Both releases and all their assets must exist as drafts before either is made public.
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$arm_id" -F draft=false
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$x64_id" -F draft=false

          echo "PASS: both architecture-specific releases published"
